            fromMorse: s => {

            formatJSON: (str, min) => { 
                if (!str.trim()) return '';

            },
            parseJWT: t => { 
                try { 
                    const p = t.trim().split('.');
                    if (p.length < 2) throw new Error("Token must have at least Header and Payload segments"); 
                    const dec = s => { 
                        let b = s.replace(/-/g, '+').replace(/_/g, '/');
                        while (b.length % 4) b += '='; 
                        const binStr = atob(b);
                        const bytes = new Uint8Array(binStr.length);
                        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                        return utf8Decoder.decode(bytes);
                    }; 
                    const header = JSON.parse(dec(p[0]));
                    const payload = JSON.parse(dec(p[1]));
                    const sigInfo = p.length >= 3 && p[2] ? `${p[2]} (Click 'Tamper & Sign' above to edit/re-sign)` : "None (Unsigned Token)";
                    
                    let notes = [];
                    const now = Math.floor(Date.now() / 1000);
                    if (payload.iat) notes.push(`Issued At: ${new Date(payload.iat * 1000).toISOString()}`);
                    if (payload.exp) notes.push(`Expires: ${new Date(payload.exp * 1000).toISOString()} (${payload.exp < now ? 'EXPIRED' : 'Valid'})`);
                    if (payload.nbf) notes.push(`Not Before: ${new Date(payload.nbf * 1000).toISOString()} (${payload.nbf > now ? 'NOT YET ACTIVE' : 'Active'})`);

                    return JSON.stringify({ Header: header, Payload: payload, Signature: sigInfo, Security_Notes: notes.length ? notes : "None" }, null, 4); 
                } catch (e) { throw new Error("Invalid or Corrupted JWT: " + e.message); } 
            },
            b64Encode: (str) => {
                const bytes = utf8Encoder.encode(str);
                let binStr = "";
                for (let i = 0; i < bytes.byteLength; i++) binStr += String.fromCharCode(bytes[i]);
                return btoa(binStr);
            },
            b64Decode: (b64) => {
                let clean = b64.trim().replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
                while (clean.length % 4 !== 0) clean += '=';
                if (!/^[A-Za-z0-9+/]*={0,2}$/.test(clean)) throw new Error("Invalid Base64 characters detected");
                const binStr = atob(clean);
                const bytes = new Uint8Array(binStr.length);
                for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                return utf8Decoder.decode(bytes);
            },
            b64UrlEncode: (str) => algosLib.b64Encode(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
            b64UrlDecode: (b64u) => algosLib.b64Decode(b64u),
            b32Encode: (s) => { 
                const bytes = utf8Encoder.encode(s);
                let bits = 0, value = 0, output = ''; 
                for (let i = 0; i < bytes.length; i++) { 
                    value = (value << 8) | bytes[i];
                    bits += 8; 
                    while (bits >= 5) {
                        output += "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"[(value >>> (bits - 5)) & 31];
                        bits -= 5;
                    } 
                } 
                if (bits > 0) output += "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"[(value << (5 - bits)) & 31]; 
                while (output.length % 8 !== 0) output += '='; 
                return output; 
            },
            b32Decode: (s) => { 
                s = s.replace(/=+$/, '').toUpperCase().replace(/\s+/g, ''); 
                let bits = 0, value = 0; 
                let bytes = [];
                for (let i = 0; i < s.length; i++) { 
                    let val = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567".indexOf(s[i]); 
                    if (val === -1) throw new Error(`Invalid Base32 character: '${s[i]}'`); 
                    value = (value << 5) | val;
                    bits += 5; 
                    if (bits >= 8) {
                        bytes.push((value >>> (bits - 8)) & 255);
                        bits -= 8;
                    } 
                } 
                return utf8Decoder.decode(new Uint8Array(bytes)); 
            },
            extractIPs: (s) => { 
                const ipv4 = s.match(/\b(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b/g) || []; 
                const ipv6 = s.match(/\b(?:[a-fA-F0-9]{1,4}:){7}[a-fA-F0-9]{1,4}\b/g) || []; 
                const all = [...new Set([...ipv4, ...ipv6])]; 
                return all.length ? all.join('\n') : 'No IPs found.'; 
            },
            extractURLs: (s) => { 
                const urls = s.match(/https?:\/\/[^\s"'<>`]+/gi) || []; 
                return urls.length ? [...new Set(urls)].join('\n') : 'No URLs found.'; 
            },
            hexdump: (s) => { 
                const bytes = utf8Encoder.encode(s);
                let out = ''; 
                for (let i = 0; i < bytes.length; i += 16) { 
                    let chunk = bytes.slice(i, i + 16); 
                    let hex = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join(' '); 
                    let ascii = Array.from(chunk).map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.').join(''); 
                    out += i.toString(16).padStart(8, '0') + '  ' + hex.padEnd(48, ' ') + '  |' + ascii + '|\n'; 
                } 
                return out || 'No data.'; 
            },
            epochConvert: (s) => { 
                s = s.trim(); 
                if (!/^-?\d+(\.\d+)?$/.test(s)) throw new Error("Invalid Unix Timestamp format"); 
                let num = parseFloat(s);
                let ms = Math.abs(num) < 10000000000 ? num * 1000 : num;
                let d = new Date(ms);
                if (isNaN(d.getTime())) throw new Error("Date out of range");
                return `UTC:   ${d.toUTCString()}\nLocal: ${d.toString()}\nISO:   ${d.toISOString()}\nEpoch (sec): ${Math.floor(ms / 1000)}\nEpoch (ms):  ${Math.floor(ms)}`; 
            },
            urlEncodeAll: (s) => {
                return Array.from(utf8Encoder.encode(s)).map(b => '%' + b.toString(16).padStart(2, '0').toUpperCase()).join('');
            },
            urlParse: (s) => {
                try {
                    const cleanUrl = s.trim();
                    const u = new URL(/^https?:\/\//i.test(cleanUrl) ? cleanUrl : `https://${cleanUrl}`); 
                    const paramsObj = {};
                    for (const [k, v] of u.searchParams.entries()) {
                        paramsObj[k] = v;
                    }
                    return JSON.stringify({ 
                        Protocol: u.protocol.replace(':', ''), 
                        Host: u.hostname, 
                        Port: u.port || (u.protocol === 'https:' ? '443' : '80'),
                        Path: u.pathname, 
                        Hash: u.hash || "None",
                        Parameters: Object.keys(paramsObj).length ? paramsObj : "None"

            },
            stringUtils: (s, mode) => { 
                if (mode === 'upper') return s.toUpperCase(); 
                if (mode === 'lower') return s.toLowerCase();

            },
            uuid: () => {

                if (typeof crypto !== 'undefined' && crypto.getRandomValues) {

            passgen: () => {

                if (typeof crypto === 'undefined' || !crypto.subtle) throw new Error("Web Crypto API unavailable.");
                const name = algo === 'sha512' ? 'SHA-512' : algo === 'sha1' ? 'SHA-1' : 'SHA-256';
                const hashBuffer = await crypto.subtle.digest(name, utf8Encoder.encode(s));
                return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
            },
            hmacHex: async (msg, secretKey) => {
                const key = await crypto.subtle.importKey(
                    'raw',
                    utf8Encoder.encode(secretKey || 'secret'),
                    { name: 'HMAC', hash: 'SHA-256' },
                    false,
                    ['sign']
                );
                const sig = await crypto.subtle.sign('HMAC', key, utf8Encoder.encode(msg));
                return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
            },
            hmacSignJwt: async (signingInput, secretKey, algName = 'HS256') => {
                const hashName = algName === 'HS512' ? 'SHA-512' : algName === 'HS384' ? 'SHA-384' : 'SHA-256';
                const key = await crypto.subtle.importKey(
                    'raw',
                    utf8Encoder.encode(secretKey || 'secret'),
                    { name: 'HMAC', hash: hashName },
                    false,
                    ['sign']
                );
                const sig = await crypto.subtle.sign('HMAC', key, utf8Encoder.encode(signingInput));
                const bytes = new Uint8Array(sig);
                let bin = '';
                for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
                return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

            aesEncrypt: async (plaintext, passphrase) => {
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const baseKey = await crypto.subtle.importKey('raw', utf8Encoder.encode(passphrase || 'secret'), 'PBKDF2', false, ['deriveKey']);
                const aesKey = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                    baseKey,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['encrypt']
                );
                const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, aesKey, utf8Encoder.encode(plaintext));
                const combined = new Uint8Array(salt.length + iv.length + cipherBuf.byteLength);
                combined.set(salt, 0);
                combined.set(iv, salt.length);
                combined.set(new Uint8Array(cipherBuf), salt.length + iv.length);
                let bin = '';
                for (let i = 0; i < combined.length; i++) bin += String.fromCharCode(combined[i]);
                return btoa(bin);
            },
            aesDecrypt: async (b64Cipher, passphrase) => {
                const clean = b64Cipher.trim().replace(/\s+/g, '');
                const bin = atob(clean);
                const combined = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) combined[i] = bin.charCodeAt(i);
                if (combined.length < 29) throw new Error("Invalid AES-GCM ciphertext payload");
                const salt = combined.slice(0, 16);
                const iv = combined.slice(16, 28);
                const data = combined.slice(28);
                const baseKey = await crypto.subtle.importKey('raw', utf8Encoder.encode(passphrase || 'secret'), 'PBKDF2', false, ['deriveKey']);
                const aesKey = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                    baseKey,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );
                try {
                    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, data);
                    return utf8Decoder.decode(plainBuf);
                } catch (e) {
                    throw new Error("AES-GCM Decryption failed (Wrong passphrase or tampered ciphertext)");
                }
            },
            runRecipe: (inputStr, steps = []) => {
                let current = inputStr;
                for (const step of steps) {
                    switch (step) {
                        case 'url_dec': current = safeUrlDecode(current); break;
                        case 'url_enc': current = encodeURIComponent(current); break;
                        case 'b64_dec': current = algosLib.b64Decode(current); break;
                        case 'b64_enc': current = algosLib.b64Encode(current); break;
                        case 'hex_dec': current = algosLib.fromHex(current); break;
                        case 'hex_enc': current = algosLib.toHex(current); break;
                        case 'html_dec': current = algosLib.htmlDecode(current); break;
                        case 'html_enc': current = escapeHTML(current); break;
                        case 'json_beautify': current = algosLib.formatJSON(current, false); break;
                        case 'json_minify': current = algosLib.formatJSON(current, true); break;
                        case 'rot47': current = algosLib.rot47(current); break;
                        case 'defang': current = algosLib.defang(current); break;
                        case 'refang': current = algosLib.refang(current); break;
                        case 'reverse': current = algosLib.rev(current); break;
                        default: break;
                    }
                }
                return current;
            },
            regexTester: (s) => {
                let parts = s.split('\n---\n');
                if (parts.length < 2) throw new Error("Format must be:\n/pattern/flags\n---\nTarget string");
                let patternStr = parts[0].trim();
                let target = parts.slice(1).join('\n---\n');
                
                let m = patternStr.match(/^\/(.*)\/([a-z]*)$/i);
                const regex = m ? new RegExp(m[1], m[2]) : new RegExp(patternStr, 'g');
                let results = [], match;
                
                if (!regex.global) {
                    let r = regex.exec(target);
                    if (r) return JSON.stringify({ matches: [r[0]], captureGroups: r.slice(1), index: r.index }, null, 4);
                    return "No Match Found.";
                }

                while ((match = regex.exec(target)) !== null) {
                    results.push({ match: match[0], captureGroups: match.slice(1), index: match.index });
                    if (match.index === regex.lastIndex) regex.lastIndex++;
                }
                return results.length ? JSON.stringify(results, null, 4) : "No Matches Found.";
            },
            csv2json: (s) => {
                const parseCSVLine = (line) => {
                    const res = [];
                    let cur = '', inQuotes = false;
                    for (let i = 0; i < line.length; i++) {
                        const c = line[i];
                        if (c === '"') {
                            if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
                            else inQuotes = !inQuotes;
                        } else if (c === ',' && !inQuotes) {
                            res.push(cur.trim());
                            cur = '';
                        } else {
                            cur += c;
                        }
                    }
                    res.push(cur.trim());
                    return res;
                };
                let lines = s.trim().split(/\r?\n/).filter(l => l.trim().length > 0);
                if (lines.length < 2) throw new Error("CSV must have a header row and at least one data row.");
                let headers = parseCSVLine(lines[0]);
                let res = [];
                for (let i = 1; i < lines.length; i++) {
                    let obj = {};
                    let currentLine = parseCSVLine(lines[i]);
                    for (let j = 0; j < headers.length; j++) {
                        obj[headers[j]] = currentLine[j] !== undefined ? currentLine[j] : '';
                    }
                    res.push(obj);
                }
                return JSON.stringify(res, null, 4);
            }

        const HistoryModal = ({ isOpen, onClose, isDark, historyItems, onRestore, onClearHistory }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" onClick={onClose}>
                    <div onClick={e => e.stopPropagation()} className={`w-full max-w-xl rounded-2xl border shadow-2xl overflow-hidden animate-slide-up ${isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-100' : 'bg-white border-zinc-200 text-zinc-800'}`}>
                        <div className={`px-5 py-4 border-b flex items-center justify-between ${isDark ? 'border-zinc-800 bg-zinc-950/60' : 'border-zinc-100 bg-zinc-50'}`}>

                                    <button onClick={onClearHistory} className="px-2.5 py-1 rounded text-[10px] font-bold bg-rose-500/15 text-rose-400 border border-rose-500/30">Clear</button>

                        <div className="max-h-96 overflow-y-auto p-3 space-y-2 custom-scrollbar">
                            {historyItems.length === 0 ? (
                                <div className="py-12 text-center text-xs opacity-50">No operations recorded in this session yet.</div>
                            ) : (
                                historyItems.map((h, i) => (
                                    <div key={i} className={`p-3 rounded-xl border flex items-center justify-between gap-3 ${isDark ? 'bg-zinc-950/60 border-zinc-800' : 'bg-zinc-50 border-zinc-200'}`}>
                                        <div className="min-w-0 flex-1">
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">{h.algo} ({h.mode})</span>
                                                <span className="text-[10px] font-mono opacity-50">{h.time}</span>

        function App() {
            const [theme, setTheme] = useState('dark');
            const [activeTab, setActiveTab] = useState('decoderx');
            const [toast, setToast] = useState(null);
            const [isContactOpen, setIsContactOpen] = useState(false);
            const [isCmdOpen, setIsCmdOpen] = useState(false);
            const [isPayloadsOpen, setIsPayloadsOpen] = useState(false);
            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [sessionHistory, setSessionHistory] = useState([]);

            const [liveUsersCount, setLiveUsersCount] = useState(1);
            const [liveNodesList, setLiveNodesList] = useState([]);
            const [currentUserId, setCurrentUserId] = useState('');
            const [showPresenceInfo, setShowPresenceInfo] = useState(false);
            const activeRecordsRef = useRef([]);

            const [workspaces, setWorkspaces] = useState([
                { id: 1, name: 'Main Payload', input: '', output: '', mode: 'decode', category: 'encoders', algo: 'base64', caesarShift: 13, vigenereKey: 'KEY', strUtilMode: 'upper', expectedHash: '', cryptoSecret: 'shiva_secret_2026', recipeSteps: ['url_dec', 'b64_dec', 'json_beautify'] }
            ]);
            const [activeWorkspaceId, setActiveWorkspaceId] = useState(1);
            const [nextWorkspaceId, setNextWorkspaceId] = useState(2);

            const [curlInput, setCurlInput] = useState('');
            const [curlParsed, setCurlParsed] = useState(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                let isMounted = true;
                let heartbeatTimer = null;
                let pruneTimer = null;
                let unsubscribeSnapshot = null;
                let userDocRef = null;
                let currentAuthUser = null;
                let bc = null;
                let globalWs = null;
                let wsReconnectTimer = null;
                let lastHereReplyTs = 0;

                const ACTIVE_TTL = 65000;
                const GLOBAL_TOPIC = 'dx_pro_suite_shiva_live_v4';
                const peerRegistry = new Map();

                const recalculateLiveCount = () => {
                    if (!isMounted) return;
                    const now = Date.now();
                    const mergedMap = new Map();

                    activeRecordsRef.current.forEach(rec => {
                        const key = rec?.deviceId || rec?.identityKey || rec?.userId;
                        if (key && rec.lastSeen && (now - rec.lastSeen < ACTIVE_TTL)) {
                            mergedMap.set(key, {
                                deviceId: key,
                                userId: rec.userId || key,
                                ipMasked: rec.ipMasked || 'Active',
                                deviceType: rec.deviceType || 'Device',
                                lastSeen: rec.lastSeen
                            });
                        }
                    });

                    peerRegistry.forEach((rec, key) => {
                        if (rec && rec.lastSeen && (now - rec.lastSeen < ACTIVE_TTL)) {
                            const existing = mergedMap.get(key);
                            if (!existing || rec.lastSeen > existing.lastSeen) {
                                mergedMap.set(key, rec);
                            }
                        } else {
                            peerRegistry.delete(key);
                        }
                    });

                    const nodes = Array.from(mergedMap.values());
                    setLiveNodesList(nodes);
                    setLiveUsersCount(Math.max(1, nodes.length));
                };

                const initLivePresence = async () => {
                    const clientMeta = await computeClientIdentity();
                    if (!isMounted) return;

                    const myNodeId = clientMeta.deviceId;
                    setCurrentUserId(myNodeId);

                    const registerSelfLocally = () => {
                        peerRegistry.set(myNodeId, {
                            deviceId: myNodeId,
                            userId: currentAuthUser?.uid || myNodeId,
                            ipMasked: clientMeta.ipMasked,
                            deviceType: clientMeta.deviceType,
                            lastSeen: Date.now()
                        });
                        recalculateLiveCount();
                    };

                    registerSelfLocally();

                    const publishGlobalSignal = (signalType) => {
                        const payload = {
                            type: signalType,
                            deviceId: myNodeId,
                            userId: currentAuthUser?.uid || myNodeId,
                            ipMasked: clientMeta.ipMasked,
                            deviceType: clientMeta.deviceType,
                            ts: Date.now()
                        };
                        fetch(`https://ntfy.sh/${GLOBAL_TOPIC}`, {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        }).catch(() => {});
                    };

                    const connectGlobalWebSocket = () => {
                        if (!isMounted) return;
                        try {
                            globalWs = new WebSocket(`wss://ntfy.sh/${GLOBAL_TOPIC}/ws?since=60s`);
                            globalWs.onopen = () => {
                                publishGlobalSignal('join');
                            };
                            globalWs.onmessage = (ev) => {
                                try {
                                    const outer = JSON.parse(ev.data);
                                    if (outer.event !== 'message' || !outer.message) return;
                                    const eventTimeMs = outer.time ? outer.time * 1000 : Date.now();
                                    if (Date.now() - eventTimeMs > ACTIVE_TTL) return;

                                    const data = JSON.parse(outer.message);
                                    if (!data || !data.deviceId) return;

                                    if (data.type === 'leave') {
                                        peerRegistry.delete(data.deviceId);
                                        recalculateLiveCount();
                                        return;
                                    }

                                    peerRegistry.set(data.deviceId, {
                                        deviceId: data.deviceId,
                                        userId: data.userId || data.deviceId,
                                        ipMasked: data.ipMasked || 'Remote',
                                        deviceType: data.deviceType || 'Device',
                                        lastSeen: Date.now()
                                    });
                                    recalculateLiveCount();

                                    if (data.type === 'join' && data.deviceId !== myNodeId) {
                                        const now = Date.now();
                                        if (now - lastHereReplyTs > 3500) {
                                            lastHereReplyTs = now;
                                            setTimeout(() => {
                                                if (isMounted) publishGlobalSignal('here');
                                            }, 150 + Math.floor(Math.random() * 400));
                                        }
                                    }
                                } catch (err) {}
                            };
                            globalWs.onclose = () => {
                                if (isMounted) {
                                    wsReconnectTimer = setTimeout(connectGlobalWebSocket, 5000);
                                }
                            };
                        } catch (e) {}
                    };

                    connectGlobalWebSocket();

                    try {
                        bc = new BroadcastChannel('decoderx_live_presence_v4');
                        bc.postMessage({
                            type: 'ping',
                            deviceId: myNodeId,
                            ipMasked: clientMeta.ipMasked,
                            deviceType: clientMeta.deviceType,
                            ts: Date.now()
                        });
                        bc.onmessage = (ev) => {
                            if (ev.data && ev.data.deviceId) {
                                if (ev.data.type === 'leave') {
                                    peerRegistry.delete(ev.data.deviceId);
                                } else {
                                    peerRegistry.set(ev.data.deviceId, {
                                        deviceId: ev.data.deviceId,
                                        userId: ev.data.userId || ev.data.deviceId,
                                        ipMasked: ev.data.ipMasked || clientMeta.ipMasked,
                                        deviceType: ev.data.deviceType || clientMeta.deviceType,
                                        lastSeen: Date.now()
                                    });
                                }
                                recalculateLiveCount();
                            }
                        };
                    } catch (e) {}

                    const sdk = window.__DX_FIREBASE_SDK__;
                    if (sdk && typeof __firebase_config !== 'undefined' && __firebase_config) {
                        try {
                            const firebaseConfig = JSON.parse(__firebase_config);
                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
                            const app = sdk.initializeApp(firebaseConfig);
                            const auth = sdk.getAuth(app);
                            const db = sdk.getFirestore(app);

                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await sdk.signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await sdk.signInAnonymously(auth);
                            }

                            const user = auth.currentUser;
                            if (user && isMounted) {
                                currentAuthUser = user;
                                setCurrentUserId(`${myNodeId} (${user.uid})`);

                                userDocRef = sdk.doc(db, 'artifacts', appId, 'public', 'data', 'active_users', myNodeId);
                                const usersColRef = sdk.collection(db, 'artifacts', appId, 'public', 'data', 'active_users');

                                const pushFirestoreHeartbeat = async () => {
                                    if (!currentAuthUser) return;
                                    try {
                                        await sdk.setDoc(userDocRef, {
                                            deviceId: myNodeId,
                                            userId: currentAuthUser.uid,
                                            identityKey: myNodeId,
                                            ipMasked: clientMeta.ipMasked,
                                            deviceType: clientMeta.deviceType,
                                            lastSeen: Date.now()
                                        });
                                    } catch (err) {}
                                };

                                await pushFirestoreHeartbeat();

                                unsubscribeSnapshot = sdk.onSnapshot(
                                    usersColRef,
                                    (snapshot) => {
                                        const list = [];
                                        snapshot.forEach(d => list.push(d.data()));
                                        activeRecordsRef.current = list;
                                        recalculateLiveCount();
                                    },
                                    () => {}
                                );
                            }
                        } catch (e) {}
                    }

                    heartbeatTimer = setInterval(() => {
                        registerSelfLocally();
                        publishGlobalSignal('ping');
                        if (bc) {
                            try {
                                bc.postMessage({
                                    type: 'ping',
                                    deviceId: myNodeId,
                                    ipMasked: clientMeta.ipMasked,
                                    deviceType: clientMeta.deviceType,
                                    ts: Date.now()
                                });
                            } catch (e) {}
                        }
                        if (userDocRef && currentAuthUser && window.__DX_FIREBASE_SDK__) {
                            try {
                                window.__DX_FIREBASE_SDK__.setDoc(userDocRef, {
                                    deviceId: myNodeId,
                                    userId: currentAuthUser.uid,
                                    identityKey: myNodeId,
                                    ipMasked: clientMeta.ipMasked,
                                    deviceType: clientMeta.deviceType,
                                    lastSeen: Date.now()
                                });
                            } catch (e) {}
                        }
                    }, 22000);

                    pruneTimer = setInterval(() => recalculateLiveCount(), 8000);
                };

                if (window.__DX_FIREBASE_SDK__) {
                    initLivePresence();
                } else {
                    window.addEventListener('dx-firebase-ready', initLivePresence, { once: true });
                }

                return () => {
                    isMounted = false;
                    if (heartbeatTimer) clearInterval(heartbeatTimer);
                    if (pruneTimer) clearInterval(pruneTimer);
                    if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
                    if (unsubscribeSnapshot) unsubscribeSnapshot();
                    if (globalWs) { try { globalWs.close(); } catch (e) {} }
                    if (bc) { try { bc.close(); } catch (e) {} }
                };
            }, []);

            useEffect(() => { 
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [theme]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        setIsCmdOpen(prev => !prev);
                    }
                    if (e.key === 'Escape') {
                        setIsCmdOpen(false);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            useEffect(() => {
                if (!toast) return;
                const timer = setTimeout(() => setToast(null), 3000);
                return () => clearTimeout(timer);
            }, [toast]);

            const isDark = theme === 'dark';

            const addWorkspace = () => {
                if (workspaces.length >= 10) return setToast("Max 10 tabs allowed");
                const newId = nextWorkspaceId;
                setWorkspaces([...workspaces, { id: newId, name: `Tab ${newId}`, input: '', output: '', mode: 'decode', category: 'encoders', algo: 'base64', caesarShift: 13, vigenereKey: 'KEY', strUtilMode: 'upper', expectedHash: '', cryptoSecret: 'shiva_secret_2026', recipeSteps: ['url_dec', 'b64_dec', 'json_beautify'] }]);
                setActiveWorkspaceId(newId);
                setNextWorkspaceId(newId + 1);
            };

            const removeWorkspace = (id) => {
                if (workspaces.length === 1) {
                    updateWorkspace(id, { input: '', output: '' });
                    return;
                }
                const updated = workspaces.filter(ws => ws.id !== id);
                setWorkspaces(updated);
                if (activeWorkspaceId === id) setActiveWorkspaceId(updated[updated.length - 1].id);
            };

            const renameWorkspace = (id, newName) => setWorkspaces(ws => ws.map(w => w.id === id ? { ...w, name: newName } : w));
            const updateWorkspace = useCallback((id, updates) => setWorkspaces(ws => ws.map(w => w.id === id ? { ...w, ...updates } : w)), []);

            const activeWs = workspaces.find(w => w.id === activeWorkspaceId) || workspaces[0];
            const activeAlgoObj = algorithms.find(a => a.id === activeWs?.algo);

            const handleGlobalFileLoad = (e) => {
                const f = e.target.files[0];
                if (!f) return;
                if (f.size > 1024 * 1024 * 5) return setToast("File too large (Max 5MB)");
                const reader = new FileReader();
                reader.onload = (ev) => {
                    if (activeTab === 'decoderx') updateWorkspace(activeWorkspaceId, { input: ev.target.result });
                    else setCurlInput(ev.target.result);
                    setToast(`Loaded: ${f.name}`);
                };
                reader.readAsText(f);
                e.target.value = null;
            };

            const handleGlobalClear = () => {
                if (activeTab === 'decoderx') updateWorkspace(activeWorkspaceId, { input: '', output: '', expectedHash: '' });
                else { setCurlInput(''); setCurlParsed(null); }
                setToast("Workspace Cleared");
            };

            const handleSendToEditor = useCallback((label, payloadText) => {
                const newId = nextWorkspaceId;
                const detected = detectPayloadType(payloadText);
                const newWs = {
                    id: newId,
                    name: label.slice(0, 18),
                    input: payloadText,
                    output: '',
                    mode: detected?.mode || 'decode',
                    category: detected?.category || 'encoders',
                    algo: detected?.algo || 'magic',
                    caesarShift: 13,
                    vigenereKey: 'KEY',
                    strUtilMode: 'upper',
                    expectedHash: '',
                    cryptoSecret: 'shiva_secret_2026',
                    recipeSteps: ['url_dec', 'b64_dec', 'json_beautify']
                };
                setWorkspaces(prev => [...prev.slice(-9), newWs]);
                setActiveWorkspaceId(newId);
                setNextWorkspaceId(newId + 1);
                setActiveTab('decoderx');
                setToast(`Opened "${label}" in Editor! 🚀`);
            }, [nextWorkspaceId]);

            const handleSaveHistory = useCallback((entry) => {
                setSessionHistory(prev => {
                    if (prev.length > 0 && prev[0].input === entry.input && prev[0].algo === entry.algo) return prev;
                    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    return [{ ...entry, time }, ...prev].slice(0, 25);
                });
            }, []);

            const handleSelectToolFromPalette = (tool) => {
                setActiveTab('decoderx');
                updateWorkspace(activeWorkspaceId, {
                    category: tool.category,
                    algo: tool.id,
                    mode: (tool.category === 'hashes' || ['uuid', 'passgen', 'url_all'].includes(tool.id)) ? 'encode' : (['magic', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'epoch', 'regex_tester', 'csv2json'].includes(tool.id) ? 'decode' : activeWs.mode)
                });
                setToast(`Selected: ${tool.name}`);
            };

            return (
                <div className="flex flex-col h-full w-full overflow-hidden select-none">
                    
                    {/* TOP APPLICATION BAR */}
                    <header className={`h-14 border-b px-3 sm:px-4 flex items-center justify-between gap-2 shrink-0 z-20 ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-zinc-200'}`}>
                        
                        {/* LEFT BRANDING + ENGINEERED BY MR SHIVA + LIVE USERS */}
                        <div className="flex items-center gap-2.5 sm:gap-3 min-w-0">
                            <div className="flex items-center gap-2.5 shrink-0">
                                <div className="flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-500">
                                    <Icons.Shield size={18} />
                                </div>
                                <div>
                                    <h1 className="text-sm font-bold tracking-tight leading-none flex items-center gap-1.5">
                                        DecoderX <span className="text-emerald-500">Pro</span>
                                    </h1>
                                    <span className="text-[9px] font-mono uppercase tracking-widest opacity-50 block mt-0.5">Cyber Toolkit</span>
                                </div>
                            </div>

                            <div className={`h-5 w-px shrink-0 ${isDark ? 'bg-zinc-800' : 'bg-zinc-200'}`}></div>
                            <div className="relative flex items-center gap-1.5 shrink-0">
                                <div className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border shrink-0 ${isDark ? 'bg-zinc-900/90 border-zinc-800/90' : 'bg-zinc-100 border-zinc-200'}`}>
                                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.9)]"></span>
                                    <span className={`text-[9px] sm:text-[10px] font-semibold tracking-wider uppercase ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>
                                        <span className="hidden md:inline">Engineered by </span>
                                        <span className="font-bold text-gradient-primary">Mr Shiva</span>
                                    </span>
                                </div>

                                <button
                                    type="button"
                                    onClick={() => setShowPresenceInfo(prev => !prev)}
                                    className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border font-mono text-[10px] sm:text-[11px] font-bold transition-all shrink-0 ${
                                        isDark 
                                        ? 'bg-zinc-900/90 border-zinc-800/90 text-emerald-400 hover:border-emerald-500/40' 
                                        : 'bg-zinc-100 border-zinc-200 text-emerald-600 hover:border-emerald-500/40'
                                    }`}
                                    title="Live Active Users"
                                >
                                    <Icons.Users size={12} className="text-emerald-500 shrink-0" />
                                    <span>{liveUsersCount}</span>
                                </button>

                                {showPresenceInfo && (
                                    <div 
                                        onClick={() => setShowPresenceInfo(false)}
                                        className={`absolute left-0 top-full mt-2 z-50 p-3 rounded-xl border shadow-xl text-[11px] w-72 animate-fade-in ${
                                            isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-300' : 'bg-white border-zinc-200 text-zinc-700'
                                        }`}
                                    >
                                        <div className="flex items-center justify-between font-bold mb-2 text-emerald-500">
                                            <span>● Live Active Users: {liveUsersCount}</span>
                                            <Icons.X size={12} className="cursor-pointer opacity-60 hover:opacity-100" />
                                        </div>
                                        <div className="space-y-1 max-h-32 overflow-y-auto mb-2 pr-1">
                                            {liveNodesList.map((node, idx) => (
                                                <div key={node.deviceId || idx} className={`flex items-center justify-between px-2 py-1 rounded text-[10px] font-mono ${isDark ? 'bg-zinc-950/70' : 'bg-zinc-100'}`}>
                                                    <span className="truncate">{node.deviceType || 'Device'} • {node.ipMasked}</span>
                                                    <span className="text-emerald-500 ml-2 shrink-0">● Online</span>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="text-[9px] opacity-60 font-mono break-all border-t pt-1.5 border-zinc-700/40">
                                            Node ID: {currentUserId || 'Initializing...'}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* TOP MODULE TABS */}
                        <div className={`flex p-1 rounded-lg border shrink-0 ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-100 border-zinc-200'}`}>
                            <button onClick={() => setActiveTab('decoderx')} className={`px-2.5 sm:px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all ${activeTab === 'decoderx' ? (isDark ? 'bg-zinc-800 text-emerald-400 shadow-sm' : 'bg-white text-emerald-600 shadow-sm') : 'text-zinc-500 hover:text-zinc-300'}`}>
                                <Icons.Terminal size={12}/> <span className="hidden xs:inline">Editor</span>
                            </button>
                            <button onClick={() => setActiveTab('curl')} className={`px-2.5 sm:px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all ${activeTab === 'curl' ? (isDark ? 'bg-zinc-800 text-indigo-400 shadow-sm' : 'bg-white text-indigo-600 shadow-sm') : 'text-zinc-500 hover:text-zinc-300'}`}>
                                <Icons.Layers size={12}/> <span className="hidden xs:inline">cURL / Burp</span>
                            </button>
                            <button onClick={() => setActiveTab('diff')} className={`px-2.5 sm:px-3 py-1.5 rounded-md text-xs font-semibold flex items-center gap-1.5 transition-all ${activeTab === 'diff' ? (isDark ? 'bg-zinc-800 text-amber-400 shadow-sm' : 'bg-white text-amber-600 shadow-sm') : 'text-zinc-500 hover:text-zinc-300'}`}>
                                <Icons.GitCompare size={12}/> <span className="hidden xs:inline">Diff</span>
                            </button>
                        </div>

                        {/* RIGHT ACTIONS */}
                        <div className="flex items-center gap-1.5 sm:gap-2 shrink-0">
                            <button
                                onClick={() => setIsPayloadsOpen(true)}
                                className={`px-2.5 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-1.5 transition-all ${
                                    isDark ? 'bg-zinc-900 border-zinc-800 text-amber-400 hover:border-amber-500/40' : 'bg-amber-50 border-amber-200 text-amber-700'
                                }`}
                                title="Bug Bounty & Pentest Payload Library"
                            >
                                <Icons.BookOpen size={13} />
                                <span className="hidden xl:inline text-[11px]">Payloads</span>
                            </button>

                            <button
                                onClick={() => setIsHistoryOpen(true)}
                                className={`px-2.5 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-1.5 transition-all ${
                                    isDark ? 'bg-zinc-900 border-zinc-800 text-indigo-400 hover:border-indigo-500/40' : 'bg-indigo-50 border-indigo-200 text-indigo-700'
                                }`}
                                title="Session History"
                            >
                                <Icons.History size={13} />
                                <span className="hidden xl:inline text-[11px]">History</span>
                            </button>

                            <button
                                onClick={() => setIsCmdOpen(true)}
                                className={`px-2.5 py-1.5 rounded-lg border text-xs font-medium flex items-center gap-2 transition-all ${
                                    isDark ? 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:text-zinc-200 hover:border-zinc-700' : 'bg-zinc-50 border-zinc-200 text-zinc-600 hover:bg-zinc-100'
                                }`}
                                title="Quick Tool Search (Ctrl + K)"
                            >
                                <Icons.Search size={13} />
                                <span className="hidden lg:inline text-[11px]">Search...</span>
                                <kbd className={`hidden sm:inline-block px-1.5 py-0.5 text-[9px] font-mono rounded border ${isDark ? 'bg-zinc-950 border-zinc-800 text-zinc-400' : 'bg-white border-zinc-200 text-zinc-500'}`}>Ctrl K</kbd>
                            </button>

                            <button 
                                onClick={() => setIsContactOpen(true)}
                                className={`px-2.5 sm:px-3 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-1.5 transition-all active:scale-95 ${
                                    isDark 
                                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 hover:border-emerald-500/50' 
                                    : 'bg-emerald-50 border-emerald-200 text-emerald-700 hover:bg-emerald-100'
                                }`}
                                title="Send Suggestion or Contact Mr Shiva"
                            >
                                <Icons.MessageSquare size={14} />
                                <span className="hidden md:inline">Contact</span>
                            </button>

                            <button onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')} className={`p-1.5 rounded-lg border transition-all ${isDark ? 'border-zinc-800 text-zinc-400 hover:text-yellow-400 hover:bg-zinc-800' : 'border-zinc-200 text-zinc-500 hover:text-blue-500 hover:bg-zinc-50'}`} title="Toggle Theme">
                                {isDark ? <Icons.Sun size={15} /> : <Icons.Moon size={15} />}
                            </button>
                        </div>
                    </header>

                    {/* MODALS */}
                    <ContactModal isOpen={isContactOpen} onClose={() => setIsContactOpen(false)} isDark={isDark} setToast={setToast} />
                    <CommandPalette isOpen={isCmdOpen} onClose={() => setIsCmdOpen(false)} onSelectTool={handleSelectToolFromPalette} isDark={isDark} />
                    <PayloadLibraryModal
                        isOpen={isPayloadsOpen}
                        onClose={() => setIsPayloadsOpen(false)}
                        isDark={isDark}
                        setToast={setToast}
                        onInsertPayload={(val) => {
                            setActiveTab('decoderx');
                            updateWorkspace(activeWorkspaceId, { input: val });
                            setToast('Payload inserted into Editor! 🛡️');
                        }}
                    />
                    <HistoryModal
                        isOpen={isHistoryOpen}
                        onClose={() => setIsHistoryOpen(false)}
                        isDark={isDark}
                        historyItems={sessionHistory}
                        onClearHistory={() => setSessionHistory([])}
                        onRestore={(h) => {
                            const tool = algorithms.find(a => a.id === h.algo);
                            setActiveTab('decoderx');
                            updateWorkspace(activeWorkspaceId, {
                                category: tool?.category || 'encoders',
                                algo: h.algo,
                                mode: h.mode,
                                input: h.input
                            });
                            setToast('Restored from session history! 🕒');
                        }}
                    />

                    {/* MAIN WORKSPACE AREA */}
                    <div className="flex-1 flex flex-col min-h-0 relative">
                        
                        {/* SECONDARY TOOLBAR */}
                        <div className={`shrink-0 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 px-4 py-2.5 border-b z-10 ${isDark ? 'bg-zinc-900/50 border-zinc-800' : 'bg-zinc-50 border-zinc-200'}`}>
                            
                            {activeTab === 'decoderx' && activeWs ? (
                                <div className="flex flex-wrap items-center gap-2">
                                    <CustomSelect 
                                        isDark={isDark} icon={toolCategories.find(c => c.id === activeWs.category)?.icon}
                                        value={activeWs.category} options={toolCategories}
                                        onChange={(e) => {
                                            const cat = e.target.value;
                                            const firstAlgo = algorithms.find(a => a.category === cat);
                                            updateWorkspace(activeWorkspaceId, {
                                                category: cat,
                                                algo: firstAlgo.id,
                                                mode: cat === 'hashes' || ['uuid', 'passgen', 'url_all', 'aes_gcm'].includes(firstAlgo.id) ? 'encode' : 'decode'
                                            });
                                        }}
                                    />
                                    <CustomSelect 
                                        isDark={isDark} icon={algorithms.find(a => a.id === activeWs.algo)?.icon}
                                        value={activeWs.algo} options={algorithms.filter(a => a.category === activeWs.category)}
                                        onChange={(e) => {
                                            const a = e.target.value;
                                            updateWorkspace(activeWorkspaceId, {
                                                algo: a,
                                                mode: (activeWs.category === 'hashes' || ['uuid', 'passgen', 'url_all', 'aes_gcm'].includes(a))
                                                    ? 'encode'
                                                    : (['magic', 'recipe', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'epoch', 'regex_tester', 'csv2json'].includes(a) ? 'decode' : activeWs.mode)
                                            });
                                        }}
                                    />
                                    
                                    {!['uuid', 'passgen', 'recipe'].includes(activeWs.algo) && (
                                        <div className={`flex p-0.5 rounded-lg border h-9 items-center ${['magic', 'recipe', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'uuid', 'passgen', 'epoch', 'string_utils', 'regex_tester', 'csv2json'].includes(activeWs.algo) || activeWs.category === 'hashes' ? 'opacity-40 pointer-events-none' : ''} ${isDark ? 'bg-zinc-800 border-zinc-700' : 'bg-zinc-200/60 border-zinc-300'}`}>
                                            {['encode', 'decode'].map(m => (
                                                <button key={m} onClick={() => updateWorkspace(activeWorkspaceId, { mode: m })} className={`px-3.5 h-full text-[11px] font-bold uppercase rounded-md transition-all ${activeWs.mode === m ? (isDark ? 'bg-zinc-700 text-white' : 'bg-white text-zinc-800 shadow-sm') : 'text-zinc-500'}`}>{m}</button>
                                            ))}
                                        </div>
                                    )}

                                    {activeWs.algo === 'recipe' && (
                                        <div className="flex flex-wrap items-center gap-1.5">
                                            {(activeWs.recipeSteps || []).map((st, idx) => (
                                                <span key={idx} className={`inline-flex items-center gap-1 px-2 py-1 rounded-md text-[11px] font-mono font-bold border ${isDark ? 'bg-zinc-800 border-zinc-700 text-emerald-400' : 'bg-white border-zinc-300 text-emerald-700'}`}>
                                                    {idx + 1}. {RECIPE_OPERATIONS.find(o => o.id === st)?.name || st}
                                                    <button
                                                        onClick={() => updateWorkspace(activeWorkspaceId, { recipeSteps: activeWs.recipeSteps.filter((_, i) => i !== idx) })}
                                                        className="hover:text-rose-400 ml-0.5"
                                                    >×</button>
                                                </span>
                                            ))}
                                            <select
                                                value=""
                                                onChange={e => {
                                                    if (!e.target.value) return;
                                                    updateWorkspace(activeWorkspaceId, { recipeSteps: [...(activeWs.recipeSteps || []), e.target.value] });
                                                }}
                                                className={`h-8 px-2 rounded-lg text-[11px] font-bold border cursor-pointer ${isDark ? 'bg-zinc-900 border-zinc-700 text-zinc-300' : 'bg-white border-zinc-300 text-zinc-700'}`}
                                            >
                                                <option value="">+ Add Step...</option>
                                                {RECIPE_OPERATIONS.map(op => <option key={op.id} value={op.id}>{op.name}</option>)}
                                            </select>
                                        </div>
                                    )}

                                    {['aes_gcm', 'hmac_sha256'].includes(activeWs.algo) && (
                                        <div className={`flex items-center gap-2 px-3 h-9 rounded-lg border text-xs ${isDark ? 'bg-zinc-800/80 border-zinc-700' : 'bg-white border-zinc-200'}`}>
                                            <Icons.Key size={12} className="text-emerald-500" />
                                            <span className="text-[10px] font-bold uppercase opacity-60">Secret:</span>
                                            <input
                                                type="text"
                                                value={activeWs.cryptoSecret || ''}
                                                onChange={e => updateWorkspace(activeWorkspaceId, { cryptoSecret: e.target.value })}
                                                placeholder="Passphrase / Key"
                                                className="w-32 bg-transparent font-mono font-bold text-emerald-500 outline-none"
                                            />
                                        </div>
                                    )}

                                    {activeWs.algo === 'caesar' && (
                                        <div className={`flex items-center gap-2 px-3 h-9 rounded-lg border text-xs ${isDark ? 'bg-zinc-800/80 border-zinc-700' : 'bg-white border-zinc-200'}`}>
                                            <span className="text-[10px] font-bold uppercase opacity-60">Shift:</span>
                                            <input type="range" min="1" max="25" value={activeWs.caesarShift} onChange={e => updateWorkspace(activeWorkspaceId, { caesarShift: e.target.value })} className="w-20 cursor-pointer accent-emerald-500" />
                                            <span className="font-mono font-bold text-emerald-500 w-5 text-center">{activeWs.caesarShift}</span>
                                        </div>
                                    )}

                                    {activeWs.algo === 'vigenere' && (
                                        <div className={`flex items-center gap-2 px-3 h-9 rounded-lg border text-xs ${isDark ? 'bg-zinc-800/80 border-zinc-700' : 'bg-white border-zinc-200'}`}>
                                            <span className="text-[10px] font-bold uppercase opacity-60">Key:</span>
                                            <input type="text" value={activeWs.vigenereKey} onChange={e => updateWorkspace(activeWorkspaceId, { vigenereKey: e.target.value.toUpperCase().replace(/[^A-Z]/g, '') })} placeholder="SECRET" className="w-20 bg-transparent font-mono font-bold text-emerald-500 uppercase outline-none" />
                                        </div>
                                    )}

                                    {activeWs.algo === 'string_utils' && (
                                        <div className={`flex p-0.5 rounded-lg border h-9 items-center ${isDark ? 'bg-zinc-800 border-zinc-700' : 'bg-zinc-200/60 border-zinc-300'}`}>
                                            {['upper', 'lower', 'title'].map(m => (
                                                <button key={m} onClick={() => updateWorkspace(activeWorkspaceId, { strUtilMode: m })} className={`px-2.5 h-full text-[11px] font-bold uppercase rounded-md transition-all ${activeWs.strUtilMode === m ? (isDark ? 'bg-zinc-700 text-emerald-400' : 'bg-white text-emerald-600 shadow-sm') : 'text-zinc-500'}`}>{m}</button>
                                            ))}
                                        </div>
                                    )}

                                    {activeAlgoObj?.desc && activeWs.algo !== 'recipe' && (
                                        <span className={`hidden xl:inline-flex items-center gap-1.5 text-[11px] ml-2 ${isDark ? 'text-zinc-400' : 'text-zinc-500'}`}>
                                            • {activeAlgoObj.desc}
                                        </span>
                                    )}
                                </div>
                            ) : activeTab === 'curl' ? (
                                <div className="text-xs font-semibold text-indigo-500 uppercase tracking-widest flex items-center gap-2"><Icons.Layers size={14}/> Deep cURL & Burp Suite HTTP Request Inspector</div>
                            ) : (
                                <div className="text-xs font-semibold text-amber-500 uppercase tracking-widest flex items-center gap-2"><Icons.GitCompare size={14}/> Side-by-Side Payload & JSON Diff Comparator</div>
                            )}

                            <div className="flex items-center gap-2 ml-auto shrink-0">
                                <input type="file" ref={fileInputRef} onChange={handleGlobalFileLoad} className="hidden" accept=".txt,.json,.xml,.csv,.log,.md,.bin,.key,.pem" />
                                <button onClick={() => fileInputRef.current.click()} className={`flex items-center gap-1.5 h-8 px-3 text-[11px] font-bold rounded-lg border transition-all ${isDark ? 'border-zinc-700 text-zinc-300 hover:bg-zinc-800' : 'border-zinc-300 text-zinc-600 hover:bg-zinc-100'}`}><Icons.Upload size={12} /> LOAD</button>
                                <button onClick={handleGlobalClear} className={`flex items-center gap-1.5 h-8 px-3 text-[11px] font-bold rounded-lg border transition-all ${isDark ? 'border-red-900/30 text-red-400 hover:bg-red-900/20' : 'border-red-200 text-red-600 hover:bg-red-50'}`}><Icons.Trash2 size={12} /> CLEAR</button>
                            </div>
                        </div>

                        {/* WORKSPACE TAB STRIP */}
                        <div className={activeTab === 'decoderx' ? `shrink-0 flex items-end px-3 pt-2 border-b overflow-x-auto tab-scroll ${isDark ? 'bg-zinc-950 border-zinc-800' : 'bg-zinc-100 border-zinc-300'}` : "hidden"}>
                            {workspaces.map(ws => <WorkspaceTab key={ws.id} ws={ws} isActive={activeWorkspaceId === ws.id} onSelect={setActiveWorkspaceId} onClose={removeWorkspace} onRename={renameWorkspace} isDark={isDark} isOnlyTab={workspaces.length === 1} />)}
                            <button onClick={addWorkspace} className={`ml-2 mb-1.5 p-1 rounded transition-colors ${isDark ? 'text-zinc-500 hover:text-white hover:bg-zinc-800' : 'text-zinc-500 hover:text-zinc-800 hover:bg-zinc-200'}`} title="New Workspace Tab"><Icons.Plus size={14} /></button>
                        </div>

                        {/* CONTENT SCROLL AREA */}
                        <div className={`flex-1 overflow-y-auto p-4 lg:p-6 ${isDark ? 'bg-zinc-950' : 'bg-zinc-100'}`}>
                            <div className={activeTab === 'decoderx' ? "block h-full" : "hidden"}>
                                {workspaces.map(ws => (
                                    <div key={ws.id} className={activeWorkspaceId === ws.id ? 'block h-full animate-fade-in' : 'hidden'}>
                                        <StandardDecoderTab isDark={isDark} setToast={setToast} AlgorithmsLib={algosLib} ws={ws} updateWorkspace={updateWorkspace} onSaveHistory={handleSaveHistory} />
                                    </div>
                                ))}
                            </div>
                            <div className={activeTab === 'curl' ? "block h-full animate-fade-in" : "hidden"}>
                                <CurlDecoderTab isDark={isDark} setToast={setToast} curlInput={curlInput} setCurlInput={setCurlInput} parsedResults={curlParsed} setParsedResults={setCurlParsed} onSendToEditor={handleSendToEditor} />
                            </div>
                            <div className={activeTab === 'diff' ? "block h-full animate-fade-in" : "hidden"}>
                                <DiffCheckerTab isDark={isDark} setToast={setToast} />
                            </div>
                        </div>
                        
                    </div>
                    
                    {/* GLOBAL TOAST NOTIFICATION */}
                    {toast && (
                        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-50 animate-slide-up">
                            <div className={`flex items-center gap-2 px-4 py-2 rounded-full shadow-lg border text-xs font-bold tracking-wide ${isDark ? 'border-emerald-500/50 text-emerald-400 bg-zinc-900' : 'border-emerald-200 text-emerald-700 bg-white'}`}>
                                <div className={`p-1 rounded-full ${isDark ? 'bg-emerald-500/20' : 'bg-emerald-100'}`}><Icons.Check size={12} /></div>
                                {toast}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
