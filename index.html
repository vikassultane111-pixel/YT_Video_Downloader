                        <header className="surface rounded-xl flex items-center justify-between gap-2 px-3 py-2 flex-shrink-0">
                            <div className="flex items-center gap-2.5">
                                <div className="relative">
                                    <div className="absolute inset-0 bg-gradient-to-br from-emerald-400 to-blue-500 blur-[6px] opacity-40 rounded-lg"></div>
                                    <div className={`relative p-1.5 rounded-lg border ${isDark ? 'bg-ink-900 border-white/10' : 'bg-white border-ink-200'}`}>
                                        <Icons.Shield size={14} strokeWidth={2.5} className="text-emerald-500" />
                                    </div>
                                </div>
                                <div>
                                    <h1 className="text-[15px] font-display font-bold tracking-tight leading-none">
                                        <span className="text-gradient">DecoderX</span>
                                    </h1>
                                    <p className={`text-[8px] font-bold tracking-[0.2em] uppercase mt-0.5 ${isDark ? 'text-ink-500' : 'text-ink-400'}`}>Pro Suite</p>
                                </div>
                            </div>

                            {/* Center: Tabs */}
                            <div className={`flex p-0.5 rounded-lg ${isDark ? 'bg-ink-900 border border-white/[0.05]' : 'bg-ink-100 border border-ink-200'}`}>
                                <button onClick={() => setActiveTab('decoderx')}
                                    className={`flex items-center gap-1.5 px-3 py-1 rounded-md text-[11px] font-semibold transition-all
                                        ${activeTab === 'decoderx'
                                            ? (isDark ? 'bg-ink-800 text-emerald-400 shadow-sm' : 'bg-white text-emerald-600 shadow-sm')
                                            : (isDark ? 'text-ink-500 hover:text-ink-300' : 'text-ink-500 hover:text-ink-700')}`}>
                                    <Icons.Terminal size={12}/> Tools
                                </button>
                                <button onClick={() => setActiveTab('curl')}
                                    className={`flex items-center gap-1.5 px-3 py-1 rounded-md text-[11px] font-semibold transition-all
                                        ${activeTab === 'curl'
                                            ? (isDark ? 'bg-ink-800 text-blue-400 shadow-sm' : 'bg-white text-blue-600 shadow-sm')
                                            : (isDark ? 'text-ink-500 hover:text-ink-300' : 'text-ink-500 hover:text-ink-700')}`}>
                                    <Icons.Layers size={12}/> cURL Parse
                                </button>
                            </div>

                            <div className="flex items-center gap-1.5">
                                <button onClick={() => setCmdOpen(true)}
                                    className={`hidden md:flex items-center gap-2 h-7 px-2.5 rounded-lg text-[11px] transition-colors
                                        ${isDark ? 'bg-ink-900 border border-white/[0.06] text-ink-400 hover:bg-ink-800 hover:text-ink-200' : 'bg-white border border-ink-200 text-ink-500 hover:bg-ink-50 hover:text-ink-800'}`}>
                                    <Icons.Search size={11} />
                                    <span>Search</span>
                                    <span className="kbd">⌘K</span>
                                </button>
                                <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
                                    className={`h-7 w-7 flex items-center justify-center rounded-lg transition-all border
                                        ${isDark ? 'bg-ink-900 border-white/[0.06] text-yellow-400 hover:border-yellow-500/30' : 'bg-white border-ink-200 text-ink-500 hover:text-blue-500 hover:border-blue-300'}`}>
                                    {isDark ? <Icons.Sun size={13} /> : <Icons.Moon size={13} />}
                                </button>
                            </div>
                        </header>

                        {/* WORKSPACE TAB BAR */}
                        {activeTab === 'decoderx' && (
                            <div className="surface rounded-xl flex items-center justify-between gap-2 px-2 py-1.5 flex-shrink-0">
                                <div className="flex items-center gap-1 overflow-x-auto tab-scroll-container">
                                    {workspaces.map(ws => (
                                        <WorkspaceTab key={ws.id} ws={ws}
                                            isActive={isSplitView || activeWorkspaceId === ws.id}
                                            onSelect={id => { setActiveWorkspaceId(id); if (isSplitView && workspaces.length === 1) setIsSplitView(false); }}
                                            onClose={removeWorkspace} onRename={renameWorkspace}
                                            isDark={isDark} isOnlyTab={workspaces.length === 1} />
                                    ))}
                                    <div className={`w-px h-4 flex-shrink-0 mx-1 ${isDark ? 'bg-white/10' : 'bg-ink-200'}`}></div>
                                    <button onClick={addWorkspace}
                                        className={`flex items-center gap-1 px-2 py-1 rounded-md text-[11px] font-semibold transition-all flex-shrink-0
                                            ${isDark ? 'text-ink-500 hover:bg-white/[0.05] hover:text-ink-200' : 'text-ink-500 hover:bg-ink-100 hover:text-ink-800'}`}>
                                        <Icons.Plus size={11} /> New
                                    </button>
                                </div>

                                <div className="flex items-center gap-1.5 flex-shrink-0">
                                    <div className={`hidden lg:flex items-center gap-1.5 text-[9px] font-medium px-2 ${isDark ? 'text-ink-500' : 'text-ink-500'}`}>
                                        <span className="kbd">⌘K</span>
                                        <span>Commands</span>
                                    </div>
                                    <button onClick={() => workspaces.length > 1 && setIsSplitView(!isSplitView)}
                                        disabled={workspaces.length <= 1}
                                        className={`flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[10px] font-semibold transition-all border
                                            ${workspaces.length <= 1 ? 'opacity-40 cursor-not-allowed' : ''}
                                            ${isSplitView
                                                ? (isDark ? 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30' : 'bg-emerald-50 text-emerald-600 border-emerald-200')
                                                : (isDark ? 'bg-ink-900 border-white/[0.06] text-ink-400 hover:bg-ink-800 hover:text-ink-200' : 'bg-white border-ink-200 text-ink-500 hover:bg-ink-50 hover:text-ink-800')}`}>
                                        {isSplitView ? <><Icons.Maximize size={10}/> Single</> : <><Icons.Columns size={10}/> Split</>}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* CONTENT */}
                        <div className={`flex flex-col w-full relative overflow-hidden ${isSplitView && activeTab === 'decoderx' ? 'flex-1 min-h-0' : 'flex-grow'}`}>
                            {activeTab === 'decoderx' ? (
                                <div className={`w-full h-full ${isSplitView
                                    ? `grid gap-2 grid-cols-1 lg:grid-cols-2 ${workspaces.length > 2 ? 'grid-rows-2' : 'grid-rows-1'} min-h-0`
                                    : 'flex flex-col min-h-0'}`}>
                                    {workspaces.map(ws => (
                                        <div key={ws.id} className={`${isSplitView
                                            ? `flex flex-col h-full min-h-0 rounded-xl overflow-hidden surface`
                                            : (activeWorkspaceId === ws.id ? 'block flex-grow min-h-0' : 'hidden')}`}>
                                            {isSplitView && (
                                                <div className={`px-3 py-1.5 border-b flex items-center justify-between flex-shrink-0 ${isDark ? 'border-white/[0.05] bg-white/[0.01]' : 'border-ink-100 bg-ink-50/50'}`}>
                                                    <div className="flex items-center gap-1.5">
                                                        <Icons.Folder size={11} className="text-emerald-500" />
                                                        <span className={`text-[11px] font-semibold ${isDark ? 'text-ink-200' : 'text-ink-700'}`}>{ws.name}</span>
                                                    </div>
                                                    <button onClick={() => removeWorkspace(ws.id)}
                                                        className={`p-0.5 rounded transition-colors ${isDark ? 'text-ink-500 hover:text-red-400' : 'text-ink-400 hover:text-red-600'}`}>
                                                        <Icons.X size={11} />
                                                    </button>
                                                </div>
                                            )}
                                            <div className="flex-1 min-h-0 relative">
                                                <StandardDecoderTab isDark={isDark} onToast={onToast} AlgorithmsLib={algosLib}
                                                    workspaceId={ws.id} isSplitView={isSplitView} registerActions={registerActions} />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="overflow-y-auto h-full custom-scrollbar pb-6">
                                    <CurlDecoderTab isDark={isDark} onToast={onToast} />
                                </div>
                            )}
                        </div>

                        {!isSplitView && (
                            <footer className="text-center flex-shrink-0 pb-1">
                                <div className={`inline-flex items-center gap-2 px-3 py-1 rounded-full text-[9px] font-medium ${isDark ? 'text-ink-500' : 'text-ink-500'}`}>
                                    <div className="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.8)]"></div>
                                    <span className="uppercase tracking-widest">Engineered by</span>
                                    <span className="text-gradient font-bold">Mr Shiva</span>
                                </div>
                            </footer>
                        )}
                    </main>

                    <Toast toasts={toasts} onDismiss={dismissToast} />
                    <CommandPalette open={cmdOpen} onClose={() => setCmdOpen(false)}
                        onSelect={(cmd) => cmd.action?.()} commands={commands} isDark={isDark} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
