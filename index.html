    <style>
        :root {
            --app-bg: #f4f4f5;
            --panel-bg: #ffffff;
            --border-color: #e4e4e7;
            --text-primary: #18181b;
            --text-secondary: #52525b;
        }
        html.dark {
            --app-bg: #09090b;
            --panel-bg: #18181b;
            --border-color: #27272a;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            color-scheme: dark; 
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--app-bg);
            color: var(--text-primary);
            transition: background-color 0.25s, color 0.25s;
            -webkit-font-smoothing: antialiased;
        }

        .text-gradient-primary {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(135deg, #34d399 0%, #3b82f6 100%);
        }

        /* IDE Style Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(161, 161, 170, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(161, 161, 170, 0.6); }
        .dark ::-webkit-scrollbar-thumb { background: rgba(82, 82, 91, 0.5); }
        .dark ::-webkit-scrollbar-thumb:hover { background: rgba(113, 113, 122, 0.7); }

        .app-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            border-radius: 0.75rem;
        }
        .dark .app-panel {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        /* High-Precision Synchronized Syntax Highlighting Overlay */
        .editor-container {
            position: relative;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
        }
        .editor-textarea, .editor-pre {
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 13px !important;
            font-weight: 400 !important;
            font-variant-ligatures: none !important;
            line-height: 1.6 !important;
            letter-spacing: 0px !important;
            white-space: pre-wrap !important;
            word-break: break-all !important;
            overflow-wrap: break-word !important;
            tab-size: 4 !important;
            padding: 1rem 1rem 1rem 1.25rem !important;
            margin: 0 !important;
            border: none !important;
            width: 100% !important;
            height: 100% !important;
            box-sizing: border-box !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }
        
        .editor-textarea {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            color: transparent !important;
            background: transparent !important;
            caret-color: #10b981 !important;
            resize: none;
            z-index: 10;
        }
        .editor-textarea.plain-mode {
            color: var(--text-primary) !important;
            caret-color: #10b981 !important;
        }
        
        .editor-textarea::selection { background: rgba(16, 185, 129, 0.25); color: transparent; }
        .dark .editor-textarea::selection { background: rgba(16, 185, 129, 0.32); color: transparent; }
        .editor-textarea.plain-mode::selection { background: rgba(16, 185, 129, 0.25); color: inherit; }
        .dark .editor-textarea.plain-mode::selection { background: rgba(16, 185, 129, 0.32); color: inherit; }

        .editor-pre {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 1;
            color: var(--text-primary);
        }

        /* Syntax Highlight Colors (Strict normal font-weight to preserve 1:1 caret alignment) */
        .json-key { color: #0284c7; } .dark .json-key { color: #38bdf8; }
        .json-string { color: #059669; } .dark .json-string { color: #34d399; }
        .json-number { color: #7c3aed; } .dark .json-number { color: #a78bfa; }
        .json-boolean { color: #e11d48; } .dark .json-boolean { color: #fb7185; }
        .json-bracket { color: #94a3b8; } .dark .json-bracket { color: #64748b; }

        .tab-scroll::-webkit-scrollbar { height: 2px; }

        *:focus-visible { outline: 2px solid #10b981; outline-offset: 2px; }
        textarea:focus, input:focus, select:focus { outline: none; }
    </style>
</head>

        const computeClientIdentity = async () => {
            let ipAddr = 'local';
            const ipEndpoints = [
                'https://api.ipify.org?format=json',
                'https://api64.ipify.org?format=json',
                'https://ipwho.is/'
            ];
            for (const url of ipEndpoints) {
                try {
                    const controller = new AbortController();
                    const timeout = setTimeout(() => controller.abort(), 2000);
                    const res = await fetch(url, { signal: controller.signal });
                    clearTimeout(timeout);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.ip) { ipAddr = data.ip; break; }
                    }
                } catch (e) {}
            }

            const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
            const deviceType = isMobile ? 'Mobile' : 'Desktop';

            const rawTraits = [
                ipAddr,
                navigator.userAgent || '',
                navigator.language || '',
                screen.width + 'x' + screen.height + 'x' + (screen.colorDepth || 24),
                Intl.DateTimeFormat().resolvedOptions().timeZone || '',
                navigator.hardwareConcurrency || '',
                navigator.deviceMemory || ''
            ].join('|');

            let hash = 2166136261;
            for (let i = 0; i < rawTraits.length; i++) {
                hash ^= rawTraits.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            const fpHex = (hash >>> 0).toString(16).padStart(8, '0');

            let deviceId = '';
            try {
                if (window.name && window.name.startsWith('dx_node_')) {
                    deviceId = window.name;
                } else {
                    const randArr = new Uint32Array(2);
                    crypto.getRandomValues(randArr);
                    const randHex = Array.from(randArr).map(n => (n >>> 0).toString(16).padStart(8, '0')).join('').slice(0, 10);
                    deviceId = `dx_node_${fpHex}_${randHex}`;
                    window.name = deviceId;
                }
            } catch (e) {
                deviceId = `dx_node_${fpHex}_${Math.random().toString(16).slice(2, 10)}`;
            }

            const ipMasked = ipAddr !== 'local'
                ? (ipAddr.includes(':') ? ipAddr.split(':').slice(0, 3).join(':') + '::*' : ipAddr.replace(/(\d+)\.(\d+)\.\d+\.\d+/, '$1.$2.*.*'))
                : 'Net-Node';

            return {
                deviceId,
                fingerprint: `fp_${fpHex}`,
                ipMasked,
                deviceType
            };
        };

        const escapeHTML = (str) => {
            if (typeof str !== 'string') return '';

                .replace(/>/g, '&gt;')

                .replace(/'/g, '&#039;');
        };

        const rawHtmlDecode = (str) => {
            if (typeof str !== 'string' || !str) return '';
            const namedEntities = {
                amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: '\u00a0',
                copy: '©', reg: '®', trade: '™', euro: '€', pound: '£', yen: '¥', cent: '¢'
            };
            return str.replace(/&(#(?:x[0-9a-fA-F]+|\d+)|[a-zA-Z0-9]+);/g, (full, entity) => {
                if (entity[0] === '#') {
                    const isHex = entity[1] === 'x' || entity[1] === 'X';
                    const code = parseInt(entity.slice(isHex ? 2 : 1), isHex ? 16 : 10);
                    return !isNaN(code) ? String.fromCodePoint(code) : full;
                }
                const lower = entity.toLowerCase();
                return Object.prototype.hasOwnProperty.call(namedEntities, lower) ? namedEntities[lower] : full;

        const detectPayloadType = (str) => {
            if (!str || typeof str !== 'string') return null;

            if (/^eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]*)?$/.test(s)) {
                return { algo: 'jwt', category: 'parsers', mode: 'decode', label: 'JWT Token Detected' };
            }
            if ((s.startsWith('{') && s.endsWith('}')) || (s.startsWith('[') && s.endsWith(']'))) {
                try { JSON.parse(s); return { algo: 'json', category: 'parsers', mode: 'decode', label: 'Valid JSON Detected' }; } catch (e) {}
            }
            if (/^hxxps?:\/\//i.test(s) || s.includes('[.]') || s.includes('[://]')) {
                return { algo: 'defang', category: 'network', mode: 'decode', label: 'Defanged URL/IP Detected' };
            }
            if (/^https?:\/\/[^\s]+$/i.test(s) && (s.includes('?') || s.includes('&') || s.includes(':'))) {
                return { algo: 'urlparse', category: 'parsers', mode: 'decode', label: 'URL Detected' };
            }
            if (/^\d{10}(\d{3})?$/.test(s)) {
                return { algo: 'epoch', category: 'utilities', mode: 'decode', label: 'Unix Epoch Detected' };
            }
            if (/^[01]{8}(\s+[01]{8})+$/.test(s)) {

            }
            if (/^(?:\\u[0-9a-fA-F]{4}){2,}/.test(s)) {
                return { algo: 'unicode', category: 'encoders', mode: 'decode', label: 'Unicode Escape Detected' };
            }
            if (/^([0-9a-fA-F]{2}\s+){3,}[0-9a-fA-F]{2}$/.test(s) || (/^[0-9a-fA-F]{16,}$/.test(s) && s.length % 2 === 0)) {
                return { algo: 'hex', category: 'encoders', mode: 'decode', label: 'Hexadecimal Detected' };
            }
            if (/%[0-9A-Fa-f]{2}/.test(s)) {
                return { algo: 'url', category: 'encoders', mode: 'decode', label: 'URL Encoding Detected' };
            }
            if (/^[A-Z2-7]{16,}={0,6}$/.test(s) && s.length % 8 === 0) {
                return { algo: 'base32', category: 'encoders', mode: 'decode', label: 'Base32 Detected' };
            }
            if (/^[A-Za-z0-9+/]{12,}={0,2}$/.test(s) && s.length % 4 === 0) {

        const getEntropy = (str) => {
            if (!str) return '0.00';
            const len = str.length;
            const frequencies = Array.from(str).reduce((freq, c) => (freq[c] = (freq[c] || 0) + 1, freq), {});

                words: text.trim().split(/\s+/).filter(w => w.length > 0).length,

        /* Tokenize raw JSON before escaping HTML so single quotes ' never turn into &#039; */
        function syntaxHighlight(jsonStr) {

            let result = "";
            let lastIndex = 0;
            let match;

            while ((match = tokenRegex.exec(jsonStr)) !== null) {
                if (match.index > lastIndex) {
                    result += escapeHTML(jsonStr.slice(lastIndex, match.index));
                }
                const rawToken = match[0];
                if (rawToken.startsWith('"')) {
                    if (match[2] !== undefined) {
                        const colonIdx = rawToken.lastIndexOf(':');
                        const keyPart = rawToken.slice(0, colonIdx);
                        const colonPart = rawToken.slice(colonIdx);
                        result += `<span class="json-key">${escapeHTML(keyPart)}</span><span class="opacity-50">${escapeHTML(colonPart)}</span>`;
                    } else {
                        result += `<span class="json-string">${escapeHTML(rawToken)}</span>`;
                    }
                } else if (rawToken === 'true' || rawToken === 'false') {
                    result += `<span class="json-boolean">${rawToken}</span>`;
                } else if (rawToken === 'null') {
                    result += `<span class="json-bracket opacity-50">${rawToken}</span>`;
                } else {
                    result += `<span class="json-number">${escapeHTML(rawToken)}</span>`;
                }
                lastIndex = tokenRegex.lastIndex;
            }

                result += escapeHTML(jsonStr.slice(lastIndex));
            }
            return result;
        }

        function safeUrlDecode(str) {
            try {
                if (str.includes('%')) return decodeURIComponent(str);
                return str;
            } catch (e) {
                try { return unescape(str); } catch (e2) { return str; }
            }
        }

        function safeFormUrlDecode(str) {
            try { return decodeURIComponent(str.replace(/\+/g, ' ')); } catch (e) { return safeUrlDecode(str); }

        function analyzeData(inputStr, isFormParam = false) {
            if (!inputStr || typeof inputStr !== 'string') {
                return { original: inputStr, final: inputStr, steps: [], isEncoded: false, b64Count: 0, urlCount: 0, isJson: false };
            }
            let current = inputStr.trim();
            let steps = [];
            let b64Count = 0;
            let urlCount = 0;
            let loopLimit = 6;

            while (loopLimit > 0) {
                let changed = false;

                if (/%[0-9A-Fa-f]{2}/.test(current) || (isFormParam && current.includes('+') && current.includes('='))) {
                    let urlDec = isFormParam ? safeFormUrlDecode(current) : safeUrlDecode(current);
                    if (urlDec !== current && urlDec !== "") {
                        current = urlDec.trim();
                        urlCount++;
                        steps.push({ method: 'URL Decode', value: current });
                        changed = true;
                        loopLimit--;
                        continue;
                    }
                }

                if (/&(?:lt|gt|quot|amp|apos|#0*39|#x0*27);/i.test(current)) {
                    let htmlDec = rawHtmlDecode(current);
                    if (htmlDec !== current && htmlDec !== "") {
                        current = htmlDec.trim();
                        steps.push({ method: 'HTML Entity Decode', value: current });
                        changed = true;
                        loopLimit--;
                        continue;
                    }
                }

                if (/^eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]*)?$/.test(current)) {
                    try {
                        const parts = current.split('.');
                        const decPart = (s) => {
                            let b = s.replace(/-/g, '+').replace(/_/g, '/');
                            while (b.length % 4) b += '=';
                            const binStr = atob(b);
                            const bytes = new Uint8Array(binStr.length);
                            for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                            return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
                        };
                        const jwtObj = {
                            Header: JSON.parse(decPart(parts[0])),
                            Payload: JSON.parse(decPart(parts[1])),
                            Signature: parts[2] || 'None'
                        };
                        current = JSON.stringify(jwtObj, null, 2);
                        b64Count++;
                        steps.push({ method: 'JWT Token Unpack', value: current });
                        changed = true;
                        break;
                    } catch (e) {}
                }

                if (/^([0-9a-fA-F]{2}\s+){3,}[0-9a-fA-F]{2}$/.test(current) || (/^[0-9a-fA-F]{16,}$/.test(current) && current.length % 2 === 0 && !/^[0-9]+$/.test(current))) {
                    try {
                        const cleanHex = current.replace(/\s+/g, '');
                        const bytes = new Uint8Array(cleanHex.length / 2);
                        for (let i = 0; i < cleanHex.length; i += 2) bytes[i / 2] = parseInt(cleanHex.substr(i, 2), 16);
                        const decodedHex = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
                        if (decodedHex && /^[\x20-\x7E\r\n\t]+$/.test(decodedHex)) {
                            current = decodedHex.trim();
                            steps.push({ method: 'Hex Decode', value: current });
                            changed = true;
                            loopLimit--;
                            continue;
                        }
                    } catch (e) {}
                }

                if (/^[A-Za-z0-9+/\-_]+={0,2}$/.test(current) && current.length >= 8 && !/^[0-9]+$/.test(current)) {
                    try {
                        let b64 = current.replace(/-/g, '+').replace(/_/g, '/');
                        while (b64.length % 4) b64 += '=';
                        const binStr = atob(b64);
                        const bytes = new Uint8Array(binStr.length);
                        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                        let decoded = new TextDecoder('utf-8', { fatal: true }).decode(bytes);

                        if (decoded && decoded !== current && /^[\x09\x0A\x0D\x20-\x7E\u00A0-\uFFFF]+$/.test(decoded)) {
                            current = decoded.trim();
                            b64Count++;

                            changed = true;
                            loopLimit--;
                            continue;
                        }
                    } catch (e) {}

                loopLimit--;

            try {
                let j = JSON.parse(current);
                if (typeof j === 'object' && j !== null) {
                    current = JSON.stringify(j, null, 2);
                    isJson = true;
                    if (steps.length > 0) {
                        steps[steps.length - 1].value = current;
                    }
                }
            } catch (e) {}

            return { original: inputStr, final: current, steps, b64Count, urlCount, isJson, isEncoded: steps.length > 0 };
        }

        function tokenizeCurl(str) {
            const tokens = [];
            let current = '';
            let inSingle = false, inDouble = false, escapeNext = false;
            for (let i = 0; i < str.length; i++) {
                const c = str[i];
                if (escapeNext) {
                    if (c !== '\n' && c !== '\r') current += c;
                    escapeNext = false;
                    continue;
                }
                if (c === '\\' && !inSingle) {
                    escapeNext = true;
                    continue;
                }
                if (c === "'" && !inDouble) {

                    continue;
                }
                if (c === '"' && !inSingle) {
                    inDouble = !inDouble;
                    continue;
                }
                if (/\s/.test(c) && !inSingle && !inDouble) {
                    if (current) {
                        tokens.push(current);
                        current = '';
                    }
                    continue;
                }
                current += c;
            }
            if (current) tokens.push(current);
            return tokens;
        }

                        JSON.parse(trimmed);
                        valid = true;
                    } catch (e) {}
                    const highlighted = syntaxHighlight(value) + (value.endsWith('\n') ? ' ' : '');
                    return { isJsonLike: true, isValidJson: valid, displayHtml: highlighted };
                }
                return { isJsonLike: false, isValidJson: false, displayHtml: '' };
            }, [value]);
            
            const handleScroll = (e) => { 
                if (preRef.current) { 
                    preRef.current.scrollTop = e.target.scrollTop; 
                    preRef.current.scrollLeft = e.target.scrollLeft; 
                } 
            };

            const handleSelectionEvent = (e) => {
                if (!onSelectChange) return;
                const el = e.target;
                const start = el.selectionStart;
                const end = el.selectionEnd;
                if (typeof start === 'number' && typeof end === 'number' && end - start >= 2) {
                    onSelectChange({ start, end, text: value.slice(start, end) });
                } else {
                    onSelectChange(null);
                }
            };
            
            return (
                <div className="editor-container group bg-transparent">
                    {isJsonLike && (
                        <div className={`absolute left-0 top-3 bottom-3 w-1 rounded-r-md z-20 transition-colors ${
                            isValidJson
                                ? (isDark ? 'bg-emerald-500/50 group-focus-within:bg-emerald-500' : 'bg-emerald-500/60 group-focus-within:bg-emerald-600')
                                : (isDark ? 'bg-amber-500/50' : 'bg-amber-500/60')
                        }`} title={isValidJson ? "Valid JSON" : "JSON Structure (Editing)"} />
                    )}
                    
                    {isJsonLike && (
                        <pre 
                            ref={preRef} 
                            className={`editor-pre ${isDark ? 'text-zinc-300' : 'text-zinc-700'}`} 
                            dangerouslySetInnerHTML={{ __html: displayHtml }} 
                            aria-hidden="true"
                        />
                    )}
                    
                    <textarea 
                        ref={textRef}
                        value={value} 
                        onChange={onChange} 
                        onScroll={handleScroll} 
                        onSelect={handleSelectionEvent}
                        onKeyUp={handleSelectionEvent}
                        onMouseUp={handleSelectionEvent}
                        readOnly={readOnly}
                        placeholder={placeholder}
                        className={`editor-textarea custom-scrollbar ${isJsonLike ? '' : 'plain-mode'} ${isDark ? 'placeholder-zinc-600' : 'placeholder-zinc-400'}`} 
                        spellCheck="false"
                        autoCapitalize="off"
                        autoComplete="off"
                        autoCorrect="off"
                    />
                </div>
            );
        };

        const CurlDecoderTab = memo(({ isDark, setToast, curlInput, setCurlInput, parsedResults, setParsedResults, onSendToEditor }) => {
            const [redactSecrets, setRedactSecrets] = useState(false);
            const [codeLang, setCodeLang] = useState('fetch');

            const maskValue = (key, val) => {
                if (!redactSecrets || !val) return val;
                if (/auth|token|key|secret|session|cookie|pass|bearer|jwt/i.test(key)) {
                    if (val.length <= 8) return '••••••••';
                    return val.substring(0, 4) + '••••••••••••' + val.substring(val.length - 4);
                }
                return val;
            };

            const parseBurpRawHttp = (rawText) => {
                let results = { method: 'GET', url: 'No URL found', fullUrl: '', queryParams: [], cookies: [], headers: [], bodyDump: null, bodyParams: [], rawBody: '' };
                const normalized = rawText.replace(/\r\n/g, '\n');
                const blankLineIdx = normalized.indexOf('\n\n');
                const headerSection = blankLineIdx > -1 ? normalized.slice(0, blankLineIdx) : normalized;
                const bodySection = blankLineIdx > -1 ? normalized.slice(blankLineIdx + 2).trim() : '';

                const lines = headerSection.split('\n').filter(l => l.trim().length > 0);
                if (lines.length === 0) throw new Error("Empty HTTP request");

                const reqLineMatch = lines[0].trim().match(/^([A-Z]+)\s+(\S+)\s+HTTP\/[\d.]+$/i);
                if (!reqLineMatch) throw new Error("Invalid HTTP request line");

                results.method = reqLineMatch[1].toUpperCase();
                const rawPath = reqLineMatch[2];
                let hostHeader = 'localhost';

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    const idx = line.indexOf(':');
                    if (idx > -1) {
                        const hName = line.slice(0, idx).trim();
                        const hVal = line.slice(idx + 1).trim();
                        if (hName.toLowerCase() === 'host') hostHeader = hVal;
                        if (hName.toLowerCase() === 'cookie') {
                            hVal.split(';').forEach(pair => {
                                const eq = pair.indexOf('=');
                                if (eq > -1) {
                                    results.cookies.push({
                                        key: pair.slice(0, eq).trim(),
                                        analysis: analyzeData(pair.slice(eq + 1).trim(), true)
                                    });
                                }
                            });
                        } else {
                            let an = analyzeData(hVal);
                            if (hName.toLowerCase() === 'authorization' && hVal.toLowerCase().startsWith('bearer ')) {
                                an = analyzeData(hVal.slice(7).trim());
                                if (an.isEncoded) an.original = hVal;
                            }
                            results.headers.push({ key: hName, rawVal: hVal, analysis: an });
                        }
                    }
                }

                const fullUrlStr = /^https?:\/\//i.test(rawPath) ? rawPath : `https://${hostHeader}${rawPath.startsWith('/') ? '' : '/'}${rawPath}`;
                results.fullUrl = fullUrlStr;
                try {
                    const u = new URL(fullUrlStr);
                    results.url = u.origin + u.pathname;
                    for (const [key, value] of u.searchParams.entries()) {
                        results.queryParams.push({ key, analysis: analyzeData(value, true) });
                    }
                } catch (e) {
                    results.url = fullUrlStr;
                }

                if (bodySection) {
                    results.rawBody = bodySection;
                    if (bodySection.includes('=') && bodySection.includes('&') && !bodySection.trim().startsWith('{')) {
                        try {
                            const params = new URLSearchParams(bodySection);
                            for (const [key, value] of params.entries()) {
                                results.bodyParams.push({ key, analysis: analyzeData(value, true) });
                            }
                        } catch (e) { results.bodyDump = analyzeData(bodySection); }
                    } else {
                        results.bodyDump = analyzeData(bodySection);
                        try {
                            const parsedJson = JSON.parse(results.bodyDump.final);
                            if (parsedJson && typeof parsedJson === 'object' && !Array.isArray(parsedJson)) {
                                Object.entries(parsedJson).forEach(([k, v]) => {
                                    if (typeof v === 'string') {
                                        const fieldAn = analyzeData(v, false);
                                        if (fieldAn.isEncoded) {
                                            results.bodyParams.push({ key: `JSON.${k}`, analysis: fieldAn });
                                        }
                                    }
                                });
                            }
                        } catch (e) {}
                    }
                }
                return results;
            };

            const processRequest = (customInput) => {
                const rawCmd = (typeof customInput === 'string' ? customInput : curlInput).trim();
                if (!rawCmd) return;

                try {
                    if (/^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)\s+\S+\s+HTTP\/[\d.]+/i.test(rawCmd)) {
                        const burpRes = parseBurpRawHttp(rawCmd);
                        setParsedResults(burpRes);
                        setToast("Burp Suite HTTP Request Deep-Decoded! 🕵️‍♀️");
                        return;
                    }

                    let results = { method: 'GET', url: 'No URL found', fullUrl: '', queryParams: [], cookies: [], headers: [], bodyDump: null, bodyParams: [], rawBody: '' };
                    const tokens = tokenizeCurl(rawCmd);
                    if (tokens.length === 0 || !tokens[0].toLowerCase().includes('curl')) {
                        return setToast("Paste a valid cURL command or Burp Raw HTTP request.");
                    }

                    let skipNext = false;
                    for (let i = 1; i < tokens.length; i++) {
                        if (skipNext) { skipNext = false; continue; }
                        const t = tokens[i];
                        
                        if (t === '-X' || t === '--request') {
                            results.method = tokens[i + 1]?.toUpperCase() || 'GET';
                            skipNext = true;
                        } else if (t.startsWith('-X') && t.length > 2) {
                            results.method = t.slice(2).toUpperCase();
                        } else if (t === '-H' || t === '--header') {
                            const header = tokens[i + 1];
                            skipNext = true;
                            if (header) {
                                const splitIdx = header.indexOf(':');
                                if (splitIdx > -1) {
                                    const hName = header.substring(0, splitIdx).trim();
                                    const hVal = header.substring(splitIdx + 1).trim();
                                    if (hName.toLowerCase() === 'cookie') {
                                        hVal.split(';').forEach(pair => { 
                                            let eqIdx = pair.indexOf('='); 
                                            if (eqIdx > -1) {
                                                results.cookies.push({
                                                    key: pair.substring(0, eqIdx).trim(),
                                                    analysis: analyzeData(pair.substring(eqIdx + 1).trim(), true)
                                                });
                                            }
                                        });
                                    } else {
                                        let an = analyzeData(hVal);
                                        if (hName.toLowerCase() === 'authorization' && hVal.toLowerCase().startsWith('bearer ')) {
                                            an = analyzeData(hVal.slice(7).trim());
                                            if (an.isEncoded) an.original = hVal; 
                                        }
                                        results.headers.push({ key: hName, rawVal: hVal, analysis: an });
                                    }
                                }
                            }
                        } else if (t === '-b' || t === '--cookie') {
                            const cookieString = tokens[i + 1];
                            skipNext = true;
                            if (cookieString) {
                                cookieString.split(';').forEach(pair => { 
                                    let eqIdx = pair.indexOf('='); 
                                    if (eqIdx > -1) {
                                        results.cookies.push({
                                            key: pair.substring(0, eqIdx).trim(),
                                            analysis: analyzeData(pair.substring(eqIdx + 1).trim(), true)
                                        });
                                    }
                                });
                            }
                        } else if (t === '-d' || t === '--data' || t === '--data-raw' || t === '--data-binary' || t === '--data-urlencode') {
                            const bodyRaw = tokens[i + 1];
                            skipNext = true;
                            if (results.method === 'GET') results.method = 'POST'; 
                            if (bodyRaw) {
                                let mergedData = bodyRaw.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n');
                                results.rawBody = mergedData;
                                if ((t === '--data-urlencode' || mergedData.includes('&')) && mergedData.includes('=') && !mergedData.trim().startsWith('{')) {
                                    try {
                                        const params = new URLSearchParams(mergedData);
                                        for (const [key, value] of params.entries()) {
                                            results.bodyParams.push({ key, analysis: analyzeData(value, true) });
                                        }
                                    } catch (e) { results.bodyDump = analyzeData(mergedData); }
                                } else {
                                    results.bodyDump = analyzeData(mergedData);
                                    try {
                                        const parsedJson = JSON.parse(results.bodyDump.final);
                                        if (parsedJson && typeof parsedJson === 'object' && !Array.isArray(parsedJson)) {
                                            Object.entries(parsedJson).forEach(([k, v]) => {
                                                if (typeof v === 'string') {
                                                    const fieldAn = analyzeData(v, false);
                                                    if (fieldAn.isEncoded) {
                                                        results.bodyParams.push({ key: `JSON.${k}`, analysis: fieldAn });
                                                    }
                                                }
                                            });
                                        }
                                    } catch (e) {}
                                }
                            }
                        } else if (t === '--url') {
                            results.url = tokens[i + 1];
                            results.fullUrl = tokens[i + 1];
                            skipNext = true;
                        } else if (/^https?:\/\//i.test(t)) {
                            results.url = t;
                            results.fullUrl = t;
                        }
                    }

                    if (results.url && results.url !== 'No URL found') {
                        try {
                            const u = new URL(results.url);
                            results.url = u.origin + u.pathname;
                            for (const [key, value] of u.searchParams.entries()) {
                                results.queryParams.push({ key, analysis: analyzeData(value, true) });
                            }
                        } catch (e) {} 
                    }
                    setParsedResults(results);
                    setToast("Payload Deep-Decoded! 🕵️‍♀️");
                } catch (e) { setToast("Error parsing request: " + e.message); }
            };

            const generateCodeSnippet = () => {
                if (!parsedResults) return '';
                const targetUrl = parsedResults.fullUrl || parsedResults.url;
                const hdrs = {};
                parsedResults.headers.forEach(h => { hdrs[h.key] = redactSecrets ? maskValue(h.key, h.analysis.original) : h.analysis.original; });
                if (parsedResults.cookies.length > 0) {
                    hdrs['Cookie'] = parsedResults.cookies.map(c => `${c.key}=${redactSecrets ? 'REDACTED' : c.analysis.original}`).join('; ');
                }

                if (codeLang === 'fetch') {
                    return `fetch(${JSON.stringify(targetUrl)}, {\n  method: ${JSON.stringify(parsedResults.method)},\n  headers: ${JSON.stringify(hdrs, null, 4).replace(/\n/g, '\n  ')}${parsedResults.rawBody ? `,\n  body: ${JSON.stringify(parsedResults.rawBody)}` : ''}\n})\n  .then(res => res.json())\n  .then(data => console.log(data));`;
                } else if (codeLang === 'python') {
                    return `import requests\n\nurl = ${JSON.stringify(targetUrl)}\nheaders = ${JSON.stringify(hdrs, null, 4)}\n${parsedResults.rawBody ? `data = ${JSON.stringify(parsedResults.rawBody)}\n\nresponse = requests.request(${JSON.stringify(parsedResults.method)}, url, headers=headers, data=data)` : `\nresponse = requests.request(${JSON.stringify(parsedResults.method)}, url, headers=headers)`}\nprint(response.text)`;
                } else if (codeLang === 'burp') {
                    let pathAndQuery = '/';
                    let host = 'localhost';
                    try {
                        const u = new URL(targetUrl);
                        pathAndQuery = u.pathname + u.search;
                        host = u.host;
                    } catch (e) {}
                    const headerLines = Object.entries(hdrs).filter(([k]) => k.toLowerCase() !== 'host').map(([k, v]) => `${k}: ${v}`).join('\n');
                    return `${parsedResults.method} ${pathAndQuery} HTTP/1.1\nHost: ${host}${headerLines ? '\n' + headerLines : ''}${parsedResults.rawBody ? `\nContent-Length: ${new TextEncoder().encode(parsedResults.rawBody).length}\n\n${parsedResults.rawBody}` : '\n\n'}`;
                } else {
                    const hFlags = Object.entries(hdrs).map(([k, v]) => `  -H '${k}: ${v}'`).join(' \\\n');
                    return `curl -X ${parsedResults.method} '${targetUrl}'${hFlags ? ' \\\n' + hFlags : ''}${parsedResults.rawBody ? ` \\\n  --data-raw '${parsedResults.rawBody.replace(/'/g, "'\\''")}'` : ''}`;
                }
            };

            const AnalysisRow = ({ itemKey, analysis }) => {
                const displayFinal = maskValue(itemKey, analysis.final);
                const displayOriginal = maskValue(itemKey, analysis.original);

                if (!analysis.isEncoded) {
                    return (
                        <div className={`flex flex-col md:flex-row border-b last:border-0 ${isDark ? 'border-zinc-800' : 'border-zinc-100'}`}>
                            <div className={`md:w-1/4 p-3 border-r flex items-center justify-between gap-2 ${isDark ? 'border-zinc-800' : 'border-zinc-100'}`}>
                                <span className={`font-semibold text-xs break-words ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>{itemKey}</span>
                                <button
                                    onClick={() => onSendToEditor(itemKey, analysis.final)}
                                    className={`px-2 py-0.5 rounded text-[10px] font-bold border shrink-0 flex items-center gap-1 transition-all ${isDark ? 'bg-zinc-800 border-zinc-700 text-emerald-400 hover:bg-emerald-500/20' : 'bg-zinc-100 border-zinc-200 text-emerald-700 hover:bg-emerald-50'}`}
                                    title="Open in Editor Workspace Tab"
                                >
                                    Editor <Icons.ArrowUpRight size={10} />
                                </button>
                            </div>
                            <div className="md:w-3/4 p-3 font-mono text-[13px] relative">
                                {analysis.isJson && !redactSecrets
                                    ? <div className={`p-3 rounded-lg overflow-x-auto relative border ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-50 border-zinc-200'}`}>
                                        <pre dangerouslySetInnerHTML={{ __html: syntaxHighlight(analysis.final) }} className="whitespace-pre-wrap leading-relaxed m-0" />
                                      </div>
                                    : <div className={`break-words ${isDark ? 'text-zinc-300' : 'text-zinc-700'}`}>{displayFinal}</div>
                                }
                            </div>
                        </div>
                    );
                }
                
                let badge = <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-500/20 text-blue-500 border border-blue-500/30">ENCODED</span>;
                if (analysis.b64Count >= 3) badge = <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-red-500/20 text-red-500 border border-red-500/30 animate-pulse">⚠️ TRIPLE B64</span>;
                else if (analysis.b64Count === 2) badge = <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-orange-500/20 text-orange-500 border border-orange-500/30">🚨 DOUBLE B64</span>;
                else if (analysis.urlCount > 0) badge = <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/20 text-emerald-500 border border-emerald-500/30">URL ENCODED</span>;

                return (
                    <div className={`flex flex-col md:flex-row border-b last:border-0 ${isDark ? 'border-zinc-800' : 'border-zinc-100'}`}>
                        <div className={`md:w-1/4 p-3 border-r flex flex-col justify-between gap-2 ${isDark ? 'border-zinc-800' : 'border-zinc-100'}`}>
                            <span className={`font-semibold text-xs break-words ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>{itemKey}</span>
                            <div className="flex flex-wrap gap-1.5">
                                <button
                                    onClick={() => onSendToEditor(`${itemKey} (Decoded)`, analysis.final)}
                                    className={`px-2 py-1 rounded text-[10px] font-bold border flex items-center gap-1 transition-all ${isDark ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20' : 'bg-emerald-50 border-emerald-200 text-emerald-700'}`}
                                >
                                    Decoded to Editor <Icons.ArrowUpRight size={10} />
                                </button>
                                <button
                                    onClick={() => onSendToEditor(`${itemKey} (Raw)`, analysis.original)}
                                    className={`px-2 py-1 rounded text-[10px] font-bold border flex items-center gap-1 transition-all ${isDark ? 'bg-zinc-800 border-zinc-700 text-zinc-400 hover:text-zinc-200' : 'bg-zinc-100 border-zinc-200 text-zinc-600'}`}
                                >
                                    Raw <Icons.ArrowUpRight size={10} />
                                </button>
                            </div>
                        </div>
                        <div className="md:w-3/4 p-3">
                            <div className="flex items-center gap-2 mb-3">{badge}</div>
                            <div className={`p-2 rounded-lg text-xs font-mono break-words mb-4 max-h-32 overflow-y-auto ${isDark ? 'bg-zinc-900 text-zinc-400' : 'bg-zinc-100 text-zinc-500'}`}>{displayOriginal}</div>
                            
                            <div className="space-y-3">
                                {analysis.steps.map((step, i) => {
                                    const isJSONView = (i === analysis.steps.length - 1) && analysis.isJson && !redactSecrets;
                                    return (
                                        <div key={i} className={`relative pl-4 border-l-2 ${isDark ? 'border-zinc-700' : 'border-zinc-200'}`}>
                                            <span className={`text-[10px] uppercase font-bold flex items-center gap-1.5 mb-1.5 ${isDark ? 'text-emerald-500' : 'text-emerald-600'}`}>
                                                {step.method}
                                            </span>
                                            {isJSONView ? (
                                                <div className={`p-2 rounded-lg overflow-x-auto max-h-[300px] font-mono text-xs border ${isDark ? 'bg-zinc-900 border-zinc-800' : 'bg-zinc-50 border-zinc-200'}`}>
                                                    <pre dangerouslySetInnerHTML={{ __html: syntaxHighlight(step.value) }} className="whitespace-pre-wrap leading-relaxed m-0" />
                                                </div>
                                            ) : (
                                                <div className={`p-2 rounded-lg font-mono text-xs break-words ${isDark ? 'bg-zinc-900 text-zinc-300' : 'bg-zinc-50 text-zinc-700'}`}>
                                                    {maskValue(itemKey, step.value)}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col gap-4 animate-fade-in w-full h-full pb-6">
                    <div className="app-panel flex flex-col flex-shrink-0">
                        <div className={`px-4 py-2.5 border-b flex flex-wrap items-center justify-between gap-2 ${isDark ? 'border-zinc-800 bg-zinc-800/30' : 'border-zinc-100 bg-zinc-50/50'}`}>
                            <div className="flex items-center gap-2">
                                <Icons.Terminal size={14} className="text-emerald-500" />
                                <span className="text-xs font-bold uppercase tracking-wider">Paste cURL Command or Burp Suite Raw HTTP Request</span>
                            </div>
                            <div className="flex flex-wrap items-center gap-2">
                                <button
                                    onClick={() => { setCurlInput(SAMPLE_CURL); processRequest(SAMPLE_CURL); }}
                                    className={`px-2.5 py-1 rounded-md text-[11px] font-bold flex items-center gap-1.5 border transition-all ${
                                        isDark ? 'bg-amber-500/10 border-amber-500/30 text-amber-400 hover:bg-amber-500/20' : 'bg-amber-50 border-amber-200 text-amber-700 hover:bg-amber-100'
                                    }`}
                                >
                                    <Icons.Zap size={12} /> Sample cURL
                                </button>
                                <button
                                    onClick={() => { setCurlInput(SAMPLE_BURP_HTTP); processRequest(SAMPLE_BURP_HTTP); }}
                                    className={`px-2.5 py-1 rounded-md text-[11px] font-bold flex items-center gap-1.5 border transition-all ${
                                        isDark ? 'bg-indigo-500/10 border-indigo-500/30 text-indigo-400 hover:bg-indigo-500/20' : 'bg-indigo-50 border-indigo-200 text-indigo-700 hover:bg-indigo-100'
                                    }`}
                                >
                                    <Icons.Layers size={12} /> Sample Burp HTTP
                                </button>
                                <button
                                    onClick={() => setRedactSecrets(!redactSecrets)}
                                    className={`px-2.5 py-1 rounded-md text-[11px] font-bold flex items-center gap-1.5 border transition-all ${
                                        redactSecrets
                                        ? 'bg-rose-500/20 border-rose-500/40 text-rose-400'
                                        : (isDark ? 'bg-zinc-800 border-zinc-700 text-zinc-400 hover:text-zinc-200' : 'bg-white border-zinc-200 text-zinc-600')
                                    }`}
                                    title="Mask tokens & cookies for safe screen-sharing"
                                >
                                    {redactSecrets ? <Icons.EyeOff size={12} /> : <Icons.Eye size={12} />}
                                    {redactSecrets ? 'Secrets Hidden' : 'Redact Secrets'}
                                </button>
                            </div>
                        </div>
                        <textarea 
                            value={curlInput} onChange={(e) => setCurlInput(e.target.value)}
                            className={`w-full p-4 outline-none resize-y min-h-[110px] font-mono text-[13px] leading-relaxed custom-scrollbar ${isDark ? 'bg-transparent text-zinc-300 placeholder-zinc-600' : 'bg-transparent text-zinc-800 placeholder-zinc-400'}`} 
                            placeholder="Paste a 'curl ...' command OR a Burp Suite Raw HTTP Request ('POST /api/v1/auth HTTP/1.1...')" spellCheck="false"
                        />
                        <div className={`px-4 py-2 border-t flex justify-between items-center ${isDark ? 'border-zinc-800' : 'border-zinc-100'}`}>
                            <span className="text-[11px] opacity-60">Auto-detects cURL & Burp Raw HTTP • Unpacks nested Base64, URL params & JWTs • 1-Click Send to Editor</span>
                            <button onClick={() => processRequest()} className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-semibold py-1.5 px-4 rounded-lg transition-all active:scale-95 flex items-center gap-2 shadow-sm">
                                <Icons.Cpu size={14} /> Parse & Decode
                            </button>
                        </div>
                    </div>

                    {parsedResults && (
                        <div className="flex flex-col gap-4 animate-slide-up flex-grow overflow-auto custom-scrollbar pr-1">
                            <div className="app-panel">
                                <div className={`px-4 py-2 border-b flex items-center gap-2 font-bold text-xs uppercase tracking-wider ${isDark ? 'border-zinc-800 bg-zinc-800/30' : 'border-zinc-100 bg-zinc-50/50'}`}><Icons.Link size={14} className="text-indigo-500"/> Endpoint</div>
                                <div className="p-4 font-mono text-[13px] break-words flex items-center gap-3">
                                    <span className={`px-2 py-0.5 rounded font-bold ${isDark ? 'bg-indigo-500/20 text-indigo-400' : 'bg-indigo-100 text-indigo-700'}`}>{parsedResults.method}</span>
                                    <span>{parsedResults.url}</span>
                                </div>

        const DiffCheckerTab = memo(({ isDark, setToast }) => {
            const [leftText, setLeftText] = useState('{\n  "user": "shiva_sec",\n  "role": "user",\n  "permissions": ["read"],\n  "debug": false\n}');
            const [rightText, setRightText] = useState('{\n  "user": "shiva_sec",\n  "role": "superadmin",\n  "permissions": ["read", "write", "delete"],\n  "debug": true,\n  "bypass": "active"\n}');

            const sortJsonKeysRecursively = (obj) => {
                if (Array.isArray(obj)) return obj.map(sortJsonKeysRecursively);
                if (obj !== null && typeof obj === 'object') {
                    return Object.keys(obj).sort().reduce((acc, key) => {
                        acc[key] = sortJsonKeysRecursively(obj[key]);
                        return acc;
                    }, {});
                }
                return obj;
            };

            const normalizeBothJsons = () => {
                let normalizedAny = false;
                try {
                    const p1 = JSON.parse(leftText);
                    setLeftText(JSON.stringify(sortJsonKeysRecursively(p1), null, 2));
                    normalizedAny = true;
                } catch (e) {}
                try {
                    const p2 = JSON.parse(rightText);
                    setRightText(JSON.stringify(sortJsonKeysRecursively(p2), null, 2));
                    normalizedAny = true;
                } catch (e) {}
                setToast(normalizedAny ? 'JSON Normalized & Keys Sorted! ✨' : 'Neither pane contains valid JSON.');
            };

            const diffRows = useMemo(() => {
                const aLines = leftText.split(/\r?\n/);
                const bLines = rightText.split(/\r?\n/);
                const maxLen = Math.max(aLines.length, bLines.length);
                const rows = [];
                let added = 0, removed = 0, unchanged = 0;

                for (let i = 0; i < maxLen; i++) {
                    const a = aLines[i];
                    const b = bLines[i];
                    if (a === b) {
                        rows.push({ line: i + 1, type: 'same', left: a ?? '', right: b ?? '' });
                        unchanged++;
                    } else {
                        if (a !== undefined && b !== undefined) {
                            rows.push({ line: i + 1, type: 'changed', left: a, right: b });
                            added++; removed++;
                        } else if (a === undefined) {
                            rows.push({ line: i + 1, type: 'added', left: '', right: b });
                            added++;
                        } else {
                            rows.push({ line: i + 1, type: 'removed', left: a, right: '' });
                            removed++;
                        }
                    }
                }
                return { rows, added, removed, unchanged };
            }, [leftText, rightText]);

            return (
                <div className="flex flex-col gap-4 h-full animate-fade-in pb-4">
                    <div className="flex flex-wrap items-center justify-between gap-2">

                            <span className="px-2.5 py-1 rounded-md bg-rose-500/15 text-rose-400 border border-rose-500/30 font-bold">-{diffRows.removed} Removed / Modified</span>
                            <span className="px-2.5 py-1 rounded-md bg-zinc-500/15 text-zinc-400 border border-zinc-500/30 font-bold">={diffRows.unchanged} Identical Lines</span>
                        </div>
                        <div className="flex items-center gap-2">

                                ✨ Normalize & Sort JSON Keys
                            </button>
                            <button onClick={() => { setLeftText(''); setRightText(''); }} className="px-3 py-1.5 rounded-lg text-xs font-bold bg-rose-500/15 text-rose-400 border border-rose-500/30 hover:bg-rose-500/25 transition-all">
                                Clear Both
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 min-h-[210px]">
                        <div className="app-panel flex flex-col overflow-hidden">
                            <div className={`px-4 py-2 border-b text-xs font-bold uppercase tracking-wider flex justify-between ${isDark ? 'border-zinc-800 bg-zinc-800/40' : 'border-zinc-200 bg-zinc-100/50'}`}>

                            </div>
                            <textarea

                                onChange={e => setLeftText(e.target.value)}
                                className={`w-full flex-1 p-3.5 font-mono text-xs resize-none bg-transparent outline-none custom-scrollbar ${isDark ? 'text-zinc-300' : 'text-zinc-800'}`}

                                <span>Modified Payload (B)</span>
                                <span className="font-mono text-[10px] opacity-60">{rightText.length} chars</span>

                            <textarea

                                className={`w-full flex-1 p-3.5 font-mono text-xs resize-none bg-transparent outline-none custom-scrollbar ${isDark ? 'text-zinc-300' : 'text-zinc-800'}`}

                    <div className="app-panel flex-1 flex flex-col overflow-hidden min-h-[240px]">
                        <div className={`px-4 py-2 border-b text-xs font-bold uppercase tracking-wider ${isDark ? 'border-zinc-800 bg-zinc-800/40' : 'border-zinc-200 bg-zinc-100/50'}`}>

                        </div>
                        <div className="flex-1 overflow-auto custom-scrollbar font-mono text-xs divide-y divide-zinc-800/30">
                            {diffRows.rows.map(r => (
                                <div key={r.line} className="grid grid-cols-12 items-stretch">

                                        {r.line}
                                    </div>
                                    <div className={`col-span-5 px-3 py-1 break-all whitespace-pre-wrap border-r ${isDark ? 'border-zinc-800' : 'border-zinc-200'} ${r.type === 'removed' || r.type === 'changed' ? 'bg-rose-500/15 text-rose-300' : ''}`}>
                                        {r.type === 'removed' || r.type === 'changed' ? `- ${r.left}` : `  ${r.left}`}
                                    </div>
                                    <div className={`col-span-6 px-3 py-1 break-all whitespace-pre-wrap ${r.type === 'added' || r.type === 'changed' ? 'bg-emerald-500/15 text-emerald-300' : ''}`}>
                                        {r.type === 'added' || r.type === 'changed' ? `+ ${r.right}` : `  ${r.right}`}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        });

        const StandardDecoderTab = memo(({ isDark, setToast, AlgorithmsLib, ws, updateWorkspace, onSaveHistory }) => {
            const { input, output, mode, category, algo, caesarShift, vigenereKey, strUtilMode, expectedHash = '', cryptoSecret = 'shiva_secret_2026', recipeSteps = ['url_dec', 'b64_dec', 'json_beautify'] } = ws;
            const [errorMsg, setErrorMsg] = useState(null);
            const [showQR, setShowQR] = useState(false);
            const [outputViewMode, setOutputViewMode] = useState('code'); // 'code' | 'tree' | 'jwt_tamper'
            const [selectionInfo, setSelectionInfo] = useState(null);
            const [jwtHeaderEdit, setJwtHeaderEdit] = useState('{\n  "alg": "HS256",\n  "typ": "JWT"\n}');
            const [jwtPayloadEdit, setJwtPayloadEdit] = useState('{\n  "sub": "user_90210",\n  "name": "Mr Shiva",\n  "role": "admin"\n}');
            const [jwtSecretKey, setJwtSecretKey] = useState('secret_key_2026');
            const [forgedJwt, setForgedJwt] = useState('');
            const qrCanvasRef = useRef(null);

            const setInput = (val) => updateWorkspace(ws.id, { input: val });
            const setOutput = (val) => updateWorkspace(ws.id, { output: val });
            const setMode = (val) => updateWorkspace(ws.id, { mode: val });

            const detectedHint = useMemo(() => {
                if (!input || algo === 'magic') return null;
                const d = detectPayloadType(input);
                if (d && d.algo !== algo) return d;
                return null;
            }, [input, algo]);

            // Sync JWT tamper fields whenever a valid JWT is loaded
            useEffect(() => {
                if (algo === 'jwt' && input && input.includes('.')) {
                    try {
                        const parts = input.trim().split('.');
                        if (parts.length >= 2) {
                            const h = JSON.parse(AlgorithmsLib.b64UrlDecode(parts[0]));
                            const p = JSON.parse(AlgorithmsLib.b64UrlDecode(parts[1]));
                            setJwtHeaderEdit(JSON.stringify(h, null, 2));
                            setJwtPayloadEdit(JSON.stringify(p, null, 2));
                        }
                    } catch (e) {}
                }
            }, [algo, input, AlgorithmsLib]);

            // Forge JWT live when editing in JWT Tamper view
            useEffect(() => {
                let active = true;
                const forge = async () => {
                    if (algo !== 'jwt') return;
                    try {
                        const hObj = JSON.parse(jwtHeaderEdit);
                        const pObj = JSON.parse(jwtPayloadEdit);
                        const hB64 = AlgorithmsLib.b64UrlEncode(JSON.stringify(hObj));
                        const pB64 = AlgorithmsLib.b64UrlEncode(JSON.stringify(pObj));
                        const signingInput = `${hB64}.${pB64}`;
                        if (String(hObj.alg).toLowerCase() === 'none') {
                            if (active) setForgedJwt(`${signingInput}.`);
                        } else {
                            const sig = await AlgorithmsLib.hmacSignJwt(signingInput, jwtSecretKey, hObj.alg);
                            if (active) setForgedJwt(`${signingInput}.${sig}`);
                        }
                    } catch (e) {
                        if (active) setForgedJwt('Invalid JSON in Header or Payload');
                    }
                };
                forge();
                return () => { active = false; };
            }, [algo, jwtHeaderEdit, jwtPayloadEdit, jwtSecretKey, AlgorithmsLib]);

            useEffect(() => {
                if (showQR && qrCanvasRef.current && output) {
                    if (window.QRCode && typeof window.QRCode.toCanvas === 'function') {
                        window.QRCode.toCanvas(
                            qrCanvasRef.current,
                            output,
                            { width: 180, margin: 1, color: { dark: '#000000', light: '#ffffff' } },
                            (err) => {
                                if (err) {
                                    setToast("Payload too large for QR code.");
                                    setShowQR(false);
                                }
                            }
                        );
                    } else {
                        setToast("QR Code library unavailable.");
                        setShowQR(false);
                    }
                }
            }, [showQR, output, setToast]);

            useEffect(() => {
                let isMounted = true;
                const process = async () => {
                    setErrorMsg(null);
                    setShowQR(false); 
                    if (algo === 'uuid') { if (isMounted) setOutput(AlgorithmsLib.uuid()); return; }
                    if (algo === 'passgen') { if (isMounted) setOutput(AlgorithmsLib.passgen()); return; }
                    if (!input) { if (isMounted) setOutput(''); return; }
                    
                    try {
                        let res = '', effectiveMode = mode;
                        if (category === 'hashes') effectiveMode = 'encode';
                        if (['magic', 'recipe', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'epoch', 'regex_tester', 'csv2json'].includes(algo)) effectiveMode = 'decode';

                        if (category === 'hashes') {
                            res = algo === 'hmac_sha256'
                                ? await AlgorithmsLib.hmacHex(input, cryptoSecret)
                                : await AlgorithmsLib.hash(input, algo);
                        } else {
                            switch (algo) {
                                case 'magic': {
                                    const analysis = analyzeData(input, true);
                                    if (analysis.steps.length > 0) {
                                        res = JSON.stringify({
                                            Detected_Layers: analysis.steps.map(s => s.method),
                                            Final_Decoded_Payload: analysis.isJson ? JSON.parse(analysis.final) : analysis.final
                                        }, null, 4);
                                    } else {
                                        res = analysis.final;
                                    }
                                    break;
                                }
                                case 'recipe': {
                                    res = AlgorithmsLib.runRecipe(input, recipeSteps);
                                    break;
                                }
                                case 'aes_gcm': {
                                    res = effectiveMode === 'encode'
                                        ? await AlgorithmsLib.aesEncrypt(input, cryptoSecret)
                                        : await AlgorithmsLib.aesDecrypt(input, cryptoSecret);
                                    break;
                                }
                                case 'defang': res = effectiveMode === 'encode' ? AlgorithmsLib.defang(input) : AlgorithmsLib.refang(input); break;
                                case 'base64': res = effectiveMode === 'encode' ? AlgorithmsLib.b64Encode(input) : AlgorithmsLib.b64Decode(input); break;
                                case 'base64url': res = effectiveMode === 'encode' ? AlgorithmsLib.b64UrlEncode(input) : AlgorithmsLib.b64UrlDecode(input); break;
                                case 'base32': res = effectiveMode === 'encode' ? AlgorithmsLib.b32Encode(input) : AlgorithmsLib.b32Decode(input); break;
                                case 'url': res = effectiveMode === 'encode' ? encodeURIComponent(input) : safeUrlDecode(input); break;
                                case 'url_all': res = effectiveMode === 'encode' ? AlgorithmsLib.urlEncodeAll(input) : safeUrlDecode(input); break;
                                case 'urlparse': res = AlgorithmsLib.urlParse(input); break;
                                case 'hex': res = effectiveMode === 'encode' ? AlgorithmsLib.toHex(input) : AlgorithmsLib.fromHex(input); break;
                                case 'unicode': res = effectiveMode === 'encode' ? AlgorithmsLib.toUnicode(input) : AlgorithmsLib.fromUnicode(input); break;
                                case 'binary': res = effectiveMode === 'encode' ? AlgorithmsLib.toBin(input) : AlgorithmsLib.fromBin(input); break;
                                case 'octal': res = effectiveMode === 'encode' ? AlgorithmsLib.toOctal(input) : AlgorithmsLib.fromOctal(input); break;
                                case 'html': res = effectiveMode === 'encode' ? escapeHTML(input) : AlgorithmsLib.htmlDecode(input); break;
                                case 'reverse': res = AlgorithmsLib.rev(input); break;
                                case 'atbash': res = AlgorithmsLib.atbash(input); break;
                                case 'rot47': res = AlgorithmsLib.rot47(input); break;
                                case 'caesar': res = AlgorithmsLib.caesarCipher(input, parseInt(caesarShift) || 13, effectiveMode === 'decode'); break;
                                case 'vigenere': res = AlgorithmsLib.vigenereCipher(input, vigenereKey, effectiveMode === 'decode'); break;
                                case 'morse': res = effectiveMode === 'encode' ? AlgorithmsLib.toMorse(input) : AlgorithmsLib.fromMorse(input); break;
                                case 'json': res = AlgorithmsLib.formatJSON(input, effectiveMode === 'encode'); break;
                                case 'csv2json': res = AlgorithmsLib.csv2json(input); break;
                                case 'jwt': res = AlgorithmsLib.parseJWT(input); break;
                                case 'hexdump': res = AlgorithmsLib.hexdump(input); break;
                                case 'extract_ips': res = AlgorithmsLib.extractIPs(input); break;
                                case 'extract_urls': res = AlgorithmsLib.extractURLs(input); break;
                                case 'epoch': res = AlgorithmsLib.epochConvert(input); break;
                                case 'string_utils': res = AlgorithmsLib.stringUtils(input, strUtilMode); break;
                                case 'regex_tester': res = AlgorithmsLib.regexTester(input); break;
                                default: res = input;
                            }
                        }
                        if (isMounted) {
                            setOutput(res);
                            if (res && input.trim().length > 3 && onSaveHistory) {
                                onSaveHistory({ algo, mode: effectiveMode, input: input.slice(0, 500), output: res.slice(0, 500) });
                            }
                        }
                    } catch (e) {
                        if (isMounted) {
                            setOutput('');
                            setErrorMsg(e.message || 'Error processing payload.');
                        }
                    }
                };
                const timeoutId = setTimeout(process, 80);
                return () => { isMounted = false; clearTimeout(timeoutId); };
            }, [input, mode, algo, category, caesarShift, vigenereKey, strUtilMode, cryptoSecret, recipeSteps]);

            const transformSelectionInPlace = (opType) => {
                if (!selectionInfo || !selectionInfo.text) return;
                const { start, end, text } = selectionInfo;
                try {
                    let replaced = text;
                    if (opType === 'magic') replaced = analyzeData(text, true).final;
                    else if (opType === 'b64_dec') replaced = AlgorithmsLib.b64Decode(text);
                    else if (opType === 'b64_enc') replaced = AlgorithmsLib.b64Encode(text);
                    else if (opType === 'url_dec') replaced = safeUrlDecode(text);
                    else if (opType === 'url_enc') replaced = encodeURIComponent(text);

                    const nextInput = input.slice(0, start) + replaced + input.slice(end);
                    setInput(nextInput);
                    setSelectionInfo(null);
                    setToast(`Selection transformed (${opType}) in-place! ⚡`);
                } catch (e) {
                    setToast(`Selection transform failed: ${e.message}`);
                }
            };

            const applyJsonFormat = (type) => {
                let formattedAny = false;
                if (output) {
                    try {
                        const parsedOut = JSON.parse(output);
                        if (typeof parsedOut === 'object' && parsedOut !== null) {
                            setOutput(type === 'beautify' ? JSON.stringify(parsedOut, null, 4) : JSON.stringify(parsedOut));
                            formattedAny = true;
                        }
                    } catch (e) {}
                }
                if (input) {
                    try {
                        const parsedIn = JSON.parse(input);
                        if (typeof parsedIn === 'object' && parsedIn !== null) {
                            setInput(type === 'beautify' ? JSON.stringify(parsedIn, null, 4) : JSON.stringify(parsedIn));
                            formattedAny = true;
                        }
                    } catch (e) {}
                }
                if (formattedAny) {
                    setToast(`JSON ${type === 'beautify' ? 'Beautified ✨' : 'Minified 🗜️'}`);
                } else {
                    setToast('No valid JSON found to format!');
                }
            };

            const downloadFile = () => {
                if (output && !errorMsg) {
                    const url = URL.createObjectURL(new Blob([output], { type: "text/plain" }));
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = `decoderx_${algo}.txt`;
                    a.click();
                    URL.revokeObjectURL(url);
                }
            };

            const swap = () => {
                if (['magic', 'recipe', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'uuid', 'passgen', 'epoch', 'regex_tester', 'csv2json'].includes(algo) || category === 'hashes') return;
                updateWorkspace(ws.id, {
                    input: output,
                    mode: mode === 'encode' ? 'decode' : 'encode'
                });
                setShowQR(false);
            };

            const inStats = useMemo(() => getStats(input), [input]);
            const outStats = useMemo(() => getStats(output), [output]);
            const isLockMode = ['magic', 'recipe', 'jwt', 'urlparse', 'hexdump', 'extract_ips', 'extract_urls', 'uuid', 'passgen', 'epoch', 'string_utils', 'regex_tester', 'csv2json'].includes(algo) || category === 'hashes';
            
            let isJsonOutput = false, formattedJsonOutput = '', parsedJsonObj = null;
            if (!errorMsg && output && (output.trim().startsWith('{') || output.trim().startsWith('['))) {
                try { parsedJsonObj = JSON.parse(output); isJsonOutput = true; formattedJsonOutput = output; } catch (e) {}
            }

            const getEntropyBadge = (e) => {
                const val = parseFloat(e);

        const WorkspaceTab = memo(({ ws, isActive, onSelect, onClose, onRename, isDark, isOnlyTab }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [editName, setEditName] = useState(ws.name);
            const inputRef = useRef(null);

            useEffect(() => { if (isEditing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [isEditing]);

            const handleRenameSubmit = () => {
                setIsEditing(false);
                if (editName.trim() && editName.trim() !== ws.name) onRename(ws.id, editName.trim());
                else setEditName(ws.name);
            };
            const handleKeyDown = (e) => { if (e.key === 'Enter') handleRenameSubmit(); if (e.key === 'Escape') { setIsEditing(false); setEditName(ws.name); } };

            return (
                <div 
                    onClick={() => !isEditing && onSelect(ws.id)} onDoubleClick={() => setIsEditing(true)}
                    className={`group flex items-center gap-2 px-3 py-1.5 min-w-[120px] max-w-[200px] cursor-pointer rounded-t-lg transition-all border-t border-x shrink-0 relative ${

                    }`}
                    style={{ marginBottom: isActive ? '-1px' : '0', borderBottomColor: isActive ? (isDark ? '#18181b' : '#ffffff') : 'transparent' }}
                >
                    <Icons.FileCode size={12} className={`shrink-0 ${isActive ? '' : 'opacity-60'}`} />
                    {isEditing ? (
                        <input ref={inputRef} type="text" value={editName} onChange={(e) => setEditName(e.target.value)} onBlur={handleRenameSubmit} onKeyDown={handleKeyDown} className="text-[11px] font-semibold w-full bg-transparent outline-none flex-grow text-emerald-500" />
                    ) : (
                        <span className="text-[11px] font-semibold truncate flex-grow select-none" title="Double-click to rename tab">{ws.name}</span>
                    )}
                    {!isOnlyTab && !isEditing && (
                        <button onClick={(e) => { e.stopPropagation(); onClose(ws.id); }} className="p-0.5 rounded opacity-0 group-hover:opacity-100 hover:bg-red-500 hover:text-white transition-all"><Icons.X size={10} /></button>
                    )}
                </div>
            );
        });

        const utf8Encoder = new TextEncoder();
        const utf8Decoder = new TextDecoder('utf-8', { fatal: false });

        const algosLib = {
            toHex: s => Array.from(utf8Encoder.encode(s)).map(b => b.toString(16).padStart(2, '0')).join(' '),
            fromHex: h => { 
                let clean = h.replace(/\s|0x|\\x|,|;|:/gi, '');
                if (clean.length % 2 !== 0) throw new Error("Invalid Hex String (Odd length)");
                if (!/^[0-9a-fA-F]*$/.test(clean)) throw new Error("Invalid Hex Characters");
                let bytes = new Uint8Array(clean.length / 2);
                for (let i = 0; i < clean.length; i += 2) bytes[i / 2] = parseInt(clean.substr(i, 2), 16);
                return utf8Decoder.decode(bytes);
            },
            toUnicode: s => Array.from(s).map(c => {
                const code = c.codePointAt(0);
                return code > 0xFFFF
                    ? `\\u{${code.toString(16).toUpperCase()}}`
                    : `\\u${code.toString(16).padStart(4, '0')}`;
            }).join(''),
            fromUnicode: s => s.replace(/\\u\{([0-9a-fA-F]+)\}|\\u([0-9a-fA-F]{4})/g, (_, p1, p2) => String.fromCodePoint(parseInt(p1 || p2, 16))),
            toBin: s => Array.from(utf8Encoder.encode(s)).map(b => b.toString(2).padStart(8, '0')).join(' '),
            fromBin: b => { 
                let clean = b.replace(/[^01]/g, ''); 
                if (clean.length === 0 || clean.length % 8 !== 0) throw new Error("Invalid Binary String (Must be a multiple of 8 bits)");
                let bytes = new Uint8Array(clean.length / 8);
                for (let i = 0; i < clean.length; i += 8) bytes[i / 8] = parseInt(clean.substr(i, 8), 2);
                return utf8Decoder.decode(bytes);
            },
            toOctal: s => Array.from(utf8Encoder.encode(s)).map(b => '\\' + b.toString(8).padStart(3, '0')).join(''),
            fromOctal: s => {
                const parts = s.includes('\\')
                    ? s.split('\\').map(p => p.trim()).filter(Boolean)
                    : s.trim().split(/\s+/).filter(Boolean);
                let bytes = new Uint8Array(parts.length);
                for (let i = 0; i < parts.length; i++) {
                    let p = parts[i];
                    if (!/^[0-7]{1,3}$/.test(p)) throw new Error("Invalid Octal formatting (Use \\nnn or space-separated octal)");
                    bytes[i] = parseInt(p, 8);
                }
                return utf8Decoder.decode(bytes);
            },
            htmlDecode: s => rawHtmlDecode(s),
            rev: s => Array.from(s).reverse().join(''),
            atbash: s => s.replace(/[a-zA-Z]/g, c => String.fromCharCode((c <= 'Z' ? 90 + 65 : 122 + 97) - c.charCodeAt(0))),
            rot47: s => s.replace(/[!-~]/g, c => String.fromCharCode((c.charCodeAt(0) - 33 + 47) % 94 + 33)),
            defang: s => s.replace(/\./g, '[.]').replace(/http/gi, 'hxxp').replace(/:\/\//g, '[://]'),
            refang: s => s.replace(/\[\.\]/g, '.').replace(/\(dot\)/gi, '.').replace(/hxxp/gi, 'http').replace(/\[:\/\/\]/g, '://').replace(/\[:\]/g, ':'),
            caesarCipher: (str, shift, dec) => {
                const s = ((shift % 26) + 26) % 26;
                return str.replace(/[a-zA-Z]/g, c => {
                    const base = c <= 'Z' ? 65 : 97;
                    return String.fromCharCode(((c.charCodeAt(0) - base + (dec ? (26 - s) : s)) % 26) + base);
                });
            },
            vigenereCipher: (str, key, dec) => { 
                let k = (key || 'KEY').toUpperCase().replace(/[^A-Z]/g, '') || 'A', ki = 0; 
                return str.replace(/[a-zA-Z]/g, c => { 
                    const shift = k.charCodeAt(ki % k.length) - 65;
                    ki++; 
                    const base = c <= 'Z' ? 65 : 97;
                    return String.fromCharCode(((c.charCodeAt(0) - base + (dec ? (26 - shift) : shift)) % 26) + base);
                }); 
            },
